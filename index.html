"distressed", "effects": {"trust": 10, "xp": {"interviewing": 2}}}, {"id": "clara_chrono", "approach": "chronology", "prompt": "Take me through your evening at home, hour by hour.", "requires": ["done:clara_open"], "response": "I dined at seven. At half past eight I took a powder for my head, read a little Trollope — The Warden, chapter nine — and went up at half past nine. My maid will tell you. Well — it was her evening out, but…", "mood": "tense", "effects": {"flags": ["clara_rehearsed"], "composure": -5, "xp": {"interviewing": 2}}}, {"id": "clara_empathy", "approach": "empathy", "prompt": "Whatever brought you to Dr. Hale is your own affair. I'm not here to expose it.", "requires": ["done:clara_open", "!flag:clara_reassured"], "once": false, "branches": [{"requires": ["trust:clara>=40"], "mood": "relieved", "response": "(She lets out a long breath.) My family think alienists are for lunatics. If my uncle learned I'd been seeing one, I'd be packed off to the country and never trusted with my own affairs again. You understand what I'm telling you.", "effects": {"trust": 15, "flags": ["clara_reassured"], "xp": {"psychology": 5}}}, {"requires": [], "mood": "guarded", "keep": true, "response": "Everybody says that. Then it's in the newspapers.", "effects": {"trust": 5}}]}, {"id": "clara_alternative", "approach": "alternative", "prompt": "Perhaps you did set out — and something frightened you away before you rang.", "requires": [{"any": ["flag:clara_rehearsed", "ev:e_glove"]}, "!flag:clara_admitted"], "once": false, "branches": [{"requires": [{"any": ["flag:clara_reassured", "trust:clara>=45"]}], "mood": "distressed", "response": "…Yes. I came. I was on the step at nine with my hand on the bell, and I heard him — Dr. Hale — shouting. I had never heard him raise his voice. 'I will not keep silent, it is my duty.' And another man, lower, older: 'You'll ruin us both.' I couldn't go in. I ran. I must have caught my glove on the railings.", "effects": {"evidence": ["t_clara_revised"], "timeline": ["tl_clara_door", "tl_argument"], "flags": ["clara_admitted"], "trust": 5, "xp": {"psychology": 8}, "handbook": ["hb_eyewitness"]}}, {"requires": [], "mood": "tense", "keep": true, "response": "(A long pause. Her hands twist in her lap.) No. I've told you. I stayed at home.", "effects": {"composure": -10}}]}, {"id": "clara_challenge", "approach": "challenge", "prompt": "Your account is too tidy, Miss Wren. People at home with a headache don't remember the chapter.", "requires": ["flag:clara_rehearsed", "!flag:clara_admitted"], "once": false, "branches": [{"requires": ["comp:clara<=30"], "mood": "angry", "response": "(She breaks.) Very well! I was there. On the step at nine. He was shouting at someone — 'I will not keep silent, it is my duty' — and a man said, 'You'll ruin us both.' I ran away like a child. Is that what you wanted? Write it in your book.", "effects": {"evidence": ["t_clara_revised"], "timeline": ["tl_clara_door", "tl_argument"], "flags": ["clara_admitted"], "trust": -15, "xp": {"interviewing": 2}}}, {"requires": [], "mood": "angry", "keep": true, "response": "How dare you. Is this how you speak to everyone who is frightened?", "effects": {"composure": -15, "trust": -10}}]}, {"id": "clara_voice", "approach": "ask", "prompt": "The other man's voice — would you know it again?", "requires": ["flag:clara_admitted"], "response": "Older than Dr. Hale, I think. Educated — a gentleman. Not a young man's voice; not Mr. Thomas, I've heard him on the stairs. I couldn't see anyone. I'm sorry. I wish I'd been braver.", "effects": {"flags": ["voice_older"], "xp": {"interviewing": 3}}}, {"id": "clara_rain", "approach": "ask", "prompt": "Was it raining when you ran?", "requires": ["flag:clara_admitted"], "response": "No — dry. It began as I reached the Marylebone Road. I remember because I'd lost a glove and my hand was cold and wet.", "effects": {"flags": ["clara_dry"], "xp": {"logic": 2}}}, {"id": "clara_ring", "approach": "ask", "prompt": "Did you ring the bell?", "requires": ["flag:clara_admitted"], "response": "No. I'm certain. My hand was on it and I took it away.", "effects": {"flags": ["clara_no_ring"], "xp": {"logic": 3}}}, {"id": "clara_apology", "approach": "rapport", "prompt": "I read your case notes. I was wrong to. It goes no further than me.", "requires": ["flag:clara_violated"], "response": "(She looks at you for a long time.) That's more honesty than I expected. Thank you for telling me. I'll answer your questions — for his sake, not yours.", "mood": "guarded", "effects": {"trust": 22, "xp": {"ethics": 3}}}], "thomas": [{"id": "thomas_open", "approach": "open", "prompt": "You called on your uncle this evening.", "response": "Is it a crime to visit one's uncle? I asked him for a loan; he gave me a sermon. I left at half past eight and went to a friend's rooms in Jermyn Street. I didn't come back. I was fetched back by a constable, like a parcel.", "mood": "guarded", "effects": {"evidence": ["t_thomas_initial"], "timeline": ["tl_thomas_friend"], "flags": ["thomas_spoke"], "xp": {"interviewing": 2}}}, {"id": "thomas_rapport", "approach": "rapport", "prompt": "Your uncle raised you, I understand.", "response": "After my father died. He paid for Harrow and Cambridge and never once let me forget it. (A pause.) He was decent, you know. Decenter than me. I said vile things to him tonight.", "mood": "distressed", "effects": {"trust": 12, "xp": {"interviewing": 2}}}, {"id": "thomas_friend", "approach": "ask", "prompt": "Which friend? We'll need a name.", "requires": ["done:thomas_open"], "response": "A friend. A gentleman doesn't drag his friends into police business.", "mood": "guarded", "effects": {"composure": -5, "flags": ["thomas_evasive"]}}, {"id": "thomas_challenge", "approach": "challenge", "prompt": "He refused you money, and two hours later he's dead. You're his heir.", "requires": ["done:thomas_open", "!flag:thomas_admitted"], "once": false, "branches": [{"requires": ["comp:thomas<=25"], "mood": "angry", "response": "All right! I was at Sallis's — a card room over a hatter's in Greek Street — from ten to nine until after midnight. A dozen men watched me lose forty pounds I haven't got. Arrest me for that, if you like. My uncle's executors will thank you.", "effects": {"evidence": ["t_thomas_revised"], "timeline": ["tl_thomas_gaming_claim"], "flags": ["thomas_admitted"], "trust": -10, "xp": {"interviewing": 2}}}, {"requires": [], "mood": "angry", "keep": true, "response": "You think I — (He stands.) I'm a wastrel, not a murderer!", "effects": {"composure": -18}}]}, {"id": "thomas_empathy", "approach": "empathy", "prompt": "I don't care where you gamble, Mr. Hale. Only where you were.", "requires": ["flag:thomas_evasive", "!flag:thomas_admitted"], "once": false, "branches": [{"requires": ["trust:thomas>=40"], "mood": "relieved", "response": "(He laughs without humour.) Sallis's, in Greek Street. A card room over a hatter's. I was there from ten to nine until past midnight — a dozen men saw me lose. If that comes out, my uncle's executors will have every excuse to tie up the estate for years.", "effects": {"evidence": ["t_thomas_revised"], "timeline": ["tl_thomas_gaming_claim"], "flags": ["thomas_admitted"], "trust": 5, "xp": {"psychology": 5}}}, {"requires": [], "mood": "guarded", "keep": true, "response": "That's what policemen always say, just before they care very much.", "effects": {"trust": 4}}]}, {"id": "thomas_note", "approach": "ask", "prompt": "Did your uncle seem troubled tonight — apart from you?", "requires": ["done:thomas_open"], "response": "Now you mention it. He said something odd at the end — that he was about to do a thing that would cost him the oldest friend he had, and that I might learn from it what duty costs. I thought he was lecturing me. He usually was.", "effects": {"evidence": ["t_thomas_duty"], "flags": ["hale_duty"], "xp": {"interviewing": 4}}}, {"id": "thomas_crane", "approach": "ask", "prompt": "Who would you call your uncle's oldest friend?", "requires": ["flag:hale_duty"], "response": "Crane, of course. Lionel Crane. They were at Bart's together. Crane's been at every Christmas dinner since I was nine. He's in the next room — ask him yourself.", "effects": {"flags": ["oldest_friend_crane"], "xp": {"logic": 3}}}], "crane": [{"id": "crane_open", "approach": "open", "prompt": "Dr. Crane. You came quickly.", "response": "Graves's sergeant knows I'm Hale's oldest friend. (He removes his spectacles and polishes them.) A terrible accident. He'd been overworking. He'll have stood too quickly, fallen, struck the fender. His watch stopped at 9:42 — that tells you the very moment.", "mood": "neutral", "effects": {"evidence": ["t_crane_accident"], "timeline": ["tl_watch"], "flags": ["crane_spoke"], "xp": {"interviewing": 2}}}, {"id": "crane_where", "approach": "chronology", "prompt": "Where were you this evening, Doctor? From eight o'clock.", "requires": ["done:crane_open"], "response": "At home in Wimpole Street. I dined alone and read. At about nine I set out and walked to the Cavendish Club — Pall Mall. I arrived at half past. Graves may ask the porter; I signed the book.", "mood": "neutral", "effects": {"evidence": ["t_crane_alibi"], "timeline": ["tl_crane_dine", "tl_crane_walk"], "xp": {"interviewing": 2}}}, {"id": "crane_lastseen", "approach": "ask", "prompt": "When did you last see Dr. Hale?", "requires": ["done:crane_open"], "response": "Oh — a week ago? More, perhaps. We'd both been busy. One always thinks there will be time.", "effects": {"evidence": ["t_crane_lastseen"], "timeline": ["tl_crane_lastseen"], "xp": {"interviewing": 1}}}, {"id": "crane_rapport", "approach": "rapport", "prompt": "You trained together, I'm told.", "requires": ["done:crane_open"], "response": "Bart's, 'sixty-eight. He was the cleverer man; I was the one who could talk to the governors. (Something passes over his face.) Edmund never cared what things cost. Other people paid that for him.", "mood": "guarded", "effects": {"trust": 8, "xp": {"psychology": 2}}}, {"id": "crane_silence", "approach": "silence", "prompt": "(Say nothing. Let the room speak.)", "requires": ["done:crane_open"], "response": "(He looks toward the consulting room.) He was particular, you know. Every book squared, every fire iron on its own hook. It used to drive me mad. (He stops, as if he had said more than he meant to, though what he said was nothing.)", "mood": "guarded", "effects": {"flags": ["crane_irons_remark"], "composure": -4, "xp": {"psychology": 3}}}, {"id": "crane_patient", "approach": "alternative", "prompt": "Could a patient have done this?", "requires": ["done:crane_open"], "response": "(Quickly.) If it was not an accident — then yes, of course. His nine o'clock, Miss Wren — bereavement mania, I understand. Women in that state are capable of anything. I'd look there, if I were you.", "mood": "neutral", "effects": {"flags": ["crane_blames_clara"], "xp": {"psychology": 3}}}, {"id": "crane_how_know", "approach": "confront", "prompt": "How do you know Miss Wren's history, Doctor?", "requires": ["flag:crane_blames_clara"], "response": "Hale… consulted me on her case. Professionally. Colleagues do. (He replaces his spectacles.) You are very thorough.", "mood": "tense", "effects": {"composure": -10, "flags": ["crane_knew_clara"], "xp": {"psychology": 3}}}, {"id": "crane_scratch", "approach": "ask", "prompt": "That scratch on your wrist looks fresh, Doctor.", "requires": ["ev:o_crane_scratch"], "response": "My cat. A vicious animal; I don't know why I keep it.", "mood": "guarded", "effects": {"composure": -6, "xp": {"interviewing": 1}}}, {"id": "crane_empathy", "approach": "empathy", "prompt": "Twenty-six years of friendship. Something went wrong between you.", "requires": ["done:crane_open", "!flag:crane_slipped"], "once": false, "branches": [{"requires": ["comp:crane<=50"], "mood": "distressed", "response": "(Quietly.) He would have ended me over one signature. One. Do you know how many certificates a man signs in a career? (He catches himself.) I speak hypothetically, of course. Professional disagreements. They happen.", "effects": {"evidence": ["t_crane_slip"], "flags": ["crane_slipped"], "composure": -10, "xp": {"psychology": 8}}}, {"requires": [], "mood": "neutral", "keep": true, "response": "Nothing went wrong. We were busy men. You're looking for a story where there's only a sad accident.", "effects": {}}]}, {"id": "crane_revisit_route", "approach": "revisit", "prompt": "Let's return to your route, Doctor. From Wimpole Street, you said.", "requires": ["ev:t_cabman", "done:crane_where"], "branches": [{"requires": ["comp:crane<=40"], "mood": "distressed", "response": "(He is silent a long moment.) I — may have walked a little way first. Up towards the Marylebone Road. To clear my head. Before I took a cab. Is that a crime?", "effects": {"composure": -10, "flags": ["crane_route_shift"], "xp": {"interviewing": 5}}}, {"requires": [], "mood": "guarded", "response": "From Wimpole Street. I have told you twice.", "effects": {"composure": -5}}]}], "bigg": [{"id": "bigg_open", "approach": "open", "prompt": "You drove cab 4127 tonight. Tell me about your fares after nine.", "response": "That I did, guv'nor. Took a gent from the corner of Harley Street and Weymouth Street — just as the rain come on, twenty past nine or a shade after — down to the Cavendish Club, Pall Mall. Tall, grey whiskers, gold spectacles, silk hat. Didn't say a word the whole way. Held his right wrist like it pained him. Paid with a florin and didn't want change.", "effects": {"evidence": ["t_cabman"], "timeline": ["tl_cab_pickup"], "xp": {"interviewing": 4}}}, {"id": "bigg_sure", "approach": "challenge", "prompt": "How can you be sure of the time?", "requires": ["done:bigg_open"], "response": "St Marylebone struck the quarter while I sat waiting for a fare, and the rain come on a few minutes after; he hailed me straight off. Can't swear to the minute, sir. Twenty past, twenty-five past. Not half past.", "effects": {"flags": ["bigg_time_range"], "xp": {"logic": 2}, "handbook": ["hb_bayes"]}}, {"id": "bigg_wimpole", "approach": "ask", "prompt": "Could you have picked him up in Wimpole Street?", "requires": ["done:bigg_open"], "response": "Not that fare. Harley Street and Weymouth Street, the north-east corner by the pillar box. I'd swear to it before the magistrate.", "effects": {"flags": ["bigg_sure_place"], "xp": {"interviewing": 2}}}, {"id": "bigg_face", "approach": "ask", "prompt": "Would you know the gentleman again?", "requires": ["done:bigg_open"], "response": "In his whiskers and his specs, I would. Sat right under my lamp to pay. But I won't say I'd know him in a crowd of gents just like him — a careful man doesn't swear to more than he saw.", "effects": {"flags": ["bigg_identify"], "xp": {"psychology": 2}, "handbook": ["hb_eyewitness"]}}]}, "reactions": {"pell": {"e_gin": {"branches": [{"requires": ["trust:pell>=40", "!flag:pell_admitted"], "mood": "distressed", "response": "(She stares at it, then sits.) It's for my chest. That's what I tell myself. I had a glass after Master Thomas left, and another, and then I was asleep by the range until near ten. If anyone came to that door, I never heard them.", "effects": {"evidence": ["t_pell_revised"], "timeline": ["tl_pell_asleep"], "flags": ["pell_admitted"], "composure": -10, "xp": {"psychology": 4}}}, {"requires": ["!flag:pell_admitted"], "mood": "angry", "keep": true, "response": "That's for my chest, and it's no business of yours what a woman keeps in her own kitchen.", "effects": {"trust": -8}}, {"requires": [], "mood": "distressed", "response": "You know already. Don't make me say it twice."}]}, "e_mending": {"branches": [{"requires": ["trust:pell>=45", "!flag:pell_admitted"], "mood": "distressed", "response": "(She looks at the untouched stocking a long moment.) No. I wasn't mending. I was asleep. I'd had gin. From before nine until near ten, by the kitchen clock.", "effects": {"evidence": ["t_pell_revised"], "timeline": ["tl_pell_asleep"], "flags": ["pell_admitted"], "composure": -10, "xp": {"psychology": 4}}}, {"requires": [], "mood": "tense", "keep": true, "response": "(She looks at the untouched stocking for a long moment, and says nothing at all.)", "effects": {"composure": -12, "flags": ["pell_vague"]}}]}, "e_bell_indicator": {"branches": [{"requires": ["trust:pell>=40", "!flag:pell_admitted"], "mood": "distressed", "response": "The flag's down? Then — someone rang. Someone rang and I never — (She covers her mouth.) I was asleep. God help me, I was asleep, and he had to go up and answer his own door.", "effects": {"evidence": ["t_pell_revised"], "timeline": ["tl_pell_asleep"], "flags": ["pell_admitted", "hale_might_answer"], "composure": -15, "xp": {"psychology": 4, "logic": 3}}}, {"requires": [], "mood": "tense", "keep": true, "response": "The flag's down? But then someone rang, and I… (She stops herself.) It sticks sometimes.", "effects": {"composure": -15, "flags": ["pell_vague"]}}]}, "e_thomas_note": {"response": "That boy. He writes like he talks — all temper, no harm.", "mood": "distressed"}, "e_diary": {"response": "The doctor kept his book himself. Miss Wren's always nine on Saturdays. And L.C., Thursday — that's Dr. Crane.", "effects": {"flags": ["knows_thursday_visitor"]}}, "e_glove": {"response": "That's Miss Wren's — she wears that scent. But she never came tonight, I'd have— (She stops.) I'd have known.", "mood": "tense", "effects": {"flags": ["pell_vague"]}}, "e_two_glasses": {"response": "Two glasses? He'd not give a patient brandy. Never. That was for colleagues and old friends.", "effects": {"evidence": ["t_pell_brandy"]}}, "e_latch": {"response": "Yes, that's how it locks. Pull it to and it's fast."}, "e_poker": {"response": "On the wrong hooks? He'd never leave them so. Never in nineteen years. He'd have put them right before he sat down.", "mood": "tense", "effects": {"evidence": ["t_pell_habits"], "xp": {"logic": 2}}}, "_default": {"response": "I don't know anything about that, sir. I keep the house; I don't meddle in the doctor's business.", "mood": "guarded"}}, "clara": {"e_glove": {"branches": [{"requires": [{"any": ["flag:clara_reassured", "trust:clara>=50"]}, "!flag:clara_admitted"], "mood": "distressed", "response": "(She closes her eyes.) Yes. It's mine. I was there. On the step at nine, my hand on the bell, and I heard him shouting — 'I will not keep silent, it is my duty' — and another man, older, saying 'You'll ruin us both.' I ran. I never rang.", "effects": {"evidence": ["t_clara_revised"], "timeline": ["tl_clara_door", "tl_argument"], "flags": ["clara_admitted"], "xp": {"psychology": 6}, "handbook": ["hb_eyewitness"]}}, {"requires": ["comp:clara<=25", "!flag:clara_admitted"], "mood": "angry", "response": "Stop — stop. Yes, I was there. I heard him quarrelling with a man — 'I will not keep silent,' he said, and the other said 'You'll ruin us both' — and I ran. Are you satisfied?", "effects": {"evidence": ["t_clara_revised"], "timeline": ["tl_clara_door", "tl_argument"], "flags": ["clara_admitted"], "trust": -10}}, {"requires": ["!flag:clara_admitted"], "mood": "tense", "keep": true, "response": "Anyone might own a grey glove.", "effects": {"composure": -20, "flags": ["clara_denied_glove"]}}, {"requires": [], "response": "I've told you everything about that now."}]}, "e_clara_file": {"response": "You read his notes about me? (She stands.) Then you know everything, and I have nothing more to say to you.", "mood": "angry", "effects": {"trust": -35, "flags": ["clara_violated"], "xp": {"ethics": -4}}}, "e_diary": {"response": "Nine o'clock. It was always nine o'clock. He let me in himself so the servants wouldn't stare.", "mood": "distressed"}, "_default": {"response": "I'm sorry. I don't understand what that has to do with me.", "mood": "guarded"}}, "thomas": {"e_thomas_note": {"response": "I wrote that in a temper and left it on his desk. It meant I'd go to the moneylenders and he could read about it — not — God, not that.", "mood": "distressed", "effects": {"composure": -10}}, "e_letter_fragment": {"response": "Crane? A false certificate? (He goes pale.) So that's what he meant about duty. Uncle Edmund would have done it, too. He'd have done it to his own mother.", "mood": "tense", "effects": {"flags": ["hale_duty"]}}, "_default": {"response": "Never seen it. Is that the best you've got?", "mood": "guarded"}}, "crane": {"e_cab_ticket": {"response": "Yes — I took a cab after all. The rain. From Wimpole Street, my own door. I'd forgotten; it hardly seemed worth mentioning.", "mood": "guarded", "effects": {"evidence": ["t_crane_cab_lie"], "timeline": ["tl_crane_cabclaim"], "composure": -10, "xp": {"interviewing": 3}}}, "t_cabman": {"branches": [{"requires": ["comp:crane<=40"], "mood": "distressed", "response": "(He sits down heavily.) Cabmen… confuse their fares. Every night. A man in spectacles, a silk hat — half the profession.", "effects": {"composure": -15}}, {"requires": [], "mood": "guarded", "response": "London has a great many gentlemen in silk hats and spectacles, Detective.", "effects": {"composure": -15}}]}, "e_letter_fragment": {"response": "Hale was overwrought. Mrs. Ellery's committal was entirely proper — her own family requested it. One does not ruin a colleague on the word of a hysterical sister.", "mood": "tense", "effects": {"composure": -20, "flags": ["crane_ellery"]}}, "e_diary": {"response": "L.C.? Thursday — ah. Yes. I'd forgotten. A brief call. Nothing of consequence.", "mood": "tense", "effects": {"composure": -12, "flags": ["crane_admits_thursday"]}}, "t_pell_crane_thursday": {"response": "Servants listen at doors and hear what they like.", "mood": "guarded", "effects": {"composure": -10}}, "e_watch_set": {"response": "Watches are jostled in a fall, Detective. You've been reading sensational novels.", "mood": "guarded", "effects": {"composure": -10}}, "e_wound_match": {"response": "A pattern. On tissue paper. I shouldn't care to put that before a jury.", "mood": "guarded", "effects": {"composure": -8}}, "e_poker": {"response": "Mrs. Pell will have hung them wrongly. She's getting old.", "mood": "guarded", "effects": {"composure": -6}}, "e_two_glasses": {"response": "Hale drank with half of Harley Street."}, "t_clara_revised": {"response": "A hysteric's account of a voice through a door. You'll forgive me if I'm unmoved.", "mood": "guarded", "effects": {"composure": -6}}, "t_porter": {"response": "Precisely. Half past nine. As I told you."}, "o_crane_scratch": {"response": "My cat.", "mood": "guarded", "effects": {"composure": -5}}, "_default": {"response": "I fail to see the relevance.", "mood": "neutral"}}, "graves": {"e_watch_set": {"response": "Set by hand? Then nine-forty-two is a lie somebody wanted us to believe. Which means we ask: who does nine-forty-two help?"}, "e_cab_ticket": {"response": "Cab 4127. Ask me to trace it."}, "_default": {"response": "Hm. Put it on your board and see what it touches."}}, "bigg": {"_default": {"response": "Couldn't tell you, sir. I know horses and streets."}}}, "observations": {"crane": {"requires": ["done:crane_open"], "intro": "Dr. Crane stands by the drawing-room fire, composed, a little too still. You let your eyes do the work.", "details": [{"id": "ticket", "x": 70, "y": 76, "label": "Waistcoat pocket", "text": "A slip of printed card protrudes from his waistcoat pocket: a hansom fare ticket. You can just read the number — 4127.", "options": [{"text": "He travelled by hansom tonight — yet he says he walked. Worth asking where the cab started.", "quality": "sound", "feedback": "A careful inference: the ticket proves a cab ride, not where it began.", "effects": {"evidence": ["e_cab_ticket"], "xp": {"observation": 8}}}, {"text": "He took a cab straight from this house. He's the murderer.", "quality": "overreach", "feedback": "The ticket doesn't say where the ride began, and Crane notices you staring at his pocket. He becomes noticeably more guarded.", "effects": {"evidence": ["e_cab_ticket"], "composure": 8, "trust": -10, "xp": {"observation": 2}}}, {"text": "A man of his means takes cabs all the time; it's meaningless.", "quality": "dismissive", "feedback": "Perhaps — but this ticket was torn tonight, and he said he walked. Dismissing it closes a door you might want open.", "effects": {}}]}, {"id": "scratch", "x": 36, "y": 90, "label": "Right wrist", "text": "As he lifts his hand to his spectacles, his cuff rides up: a fresh red scratch, two inches long, across the back of the right wrist.", "options": [{"text": "A recent scratch. It could come from a struggle — or a cat, a thorn, a cufflink. Worth a question.", "quality": "sound", "feedback": "Good: noted as a lead, not as a verdict.", "effects": {"evidence": ["o_crane_scratch"], "xp": {"observation": 6}}}, {"text": "Hale scratched him fighting for his life.", "quality": "overreach", "feedback": "You may be right — but you've stated a guess as a fact, and he saw you look. Crane tugs his cuff down and gives you nothing for a while.", "effects": {"evidence": ["o_crane_scratch"], "composure": 10, "trust": -15, "xp": {"observation": 1}}}]}, {"id": "ink", "x": 60, "y": 90, "label": "Right forefinger", "text": "A faint blue-black stain on the side of the right forefinger.", "options": [{"text": "He writes a great deal, like most physicians.", "quality": "sound", "feedback": "True, and probably irrelevant. Not every detail is a clue.", "effects": {"xp": {"observation": 2}}}, {"text": "He forged the entry in the diary.", "quality": "wrong", "feedback": "Nothing suggests the diary is forged: the entries are in Hale's own hand. An ink stain on a doctor is the least surprising thing in London.", "effects": {"trust": -5}}]}, {"id": "shoes", "x": 88, "y": 95, "label": "Shoes", "text": "Black shoes, wet at the welts and spattered to the ankle.", "options": [{"text": "He came through wet streets — like everyone else tonight.", "quality": "sound", "feedback": "Right. In a rainstorm, wet shoes are not information.", "effects": {"xp": {"logic": 2}}}, {"text": "He walked a long way in the rain, so he's telling the truth about walking.", "quality": "wrong", "feedback": "He came here from his club at 10:40 in the rain. These splashes could come from that walk alone.", "effects": {}}]}]}, "clara": {"requires": ["done:clara_open"], "intro": "Miss Wren sits very straight on the edge of a chair. You watch her hands first.", "details": [{"id": "hands", "x": 50, "y": 90, "label": "Hands", "text": "Her hands are bare and red with cold. She has no gloves with her at all.", "options": [{"text": "She has lost or left her gloves somewhere recently — on a November night.", "quality": "sound", "feedback": "A small, true thing. Where would a lady lose her gloves?", "effects": {"flags": ["clara_no_gloves"], "xp": {"observation": 5}}}, {"text": "She took them off to strike Dr. Hale.", "quality": "overreach", "feedback": "That leaps a long way from cold hands. She sees the suspicion in your face and withdraws.", "effects": {"trust": -12, "composure": -5}}]}, {"id": "hem", "x": 14, "y": 95, "label": "Hem of her skirt", "text": "A band of dried mud along the hem of her grey skirt, a hand's breadth deep.", "options": [{"text": "She has walked in the streets today — though not necessarily tonight.", "quality": "sound", "feedback": "Carefully put. Dried mud could be from the afternoon. But it sits oddly with 'stayed at home'.", "effects": {"flags": ["clara_hem"], "xp": {"observation": 5}}}, {"text": "She walked to Harley Street tonight.", "quality": "overreach", "feedback": "Possibly — but dried mud doesn't tell the hour. You've decided before you've proved.", "effects": {"flags": ["clara_hem"], "trust": -5}}]}, {"id": "eyes", "x": 50, "y": 34, "label": "Eyes", "text": "Her eyes slide away whenever you mention the diary, and she has been crying.", "options": [{"text": "She's frightened of something. Fear has many sources — grief, shame, or guilt.", "quality": "sound", "feedback": "Exactly. Gaze aversion is a poor lie detector; it tells you there is an emotion, not which one.", "effects": {"xp": {"psychology": 5}, "handbook": ["hb_body_language"]}}, {"text": "Averted eyes: she's lying about the murder.", "quality": "wrong", "feedback": "Research consistently finds gaze aversion is not a reliable sign of lying. She may be grieving, ashamed — or lying about something else entirely.", "effects": {"trust": -8, "handbook": ["hb_body_language"]}}]}]}, "pell": {"requires": ["done:pell_open"], "intro": "Mrs. Pell stands by her range with her hands folded, as she has stood for nineteen years.", "details": [{"id": "breath", "x": 50, "y": 52, "label": "Her breath", "text": "When she leans to pour the tea, a faint sharp smell — juniper.", "options": [{"text": "She's had gin this evening. It might have made her sleepy.", "quality": "sound", "feedback": "A reasonable lead. Gin doesn't prove sleep, but it's worth checking her account of the evening.", "effects": {"flags": ["pell_gin_smell"], "xp": {"observation": 5}}}, {"text": "She's a drunkard and her whole account is worthless.", "quality": "overreach", "feedback": "Contempt is not deduction. She notices your expression, and her shoulders set against you.", "effects": {"trust": -12}}]}, {"id": "cap", "x": 50, "y": 16, "label": "Her cap", "text": "Her cap sits a little askew, and there is a crease on one cheek, as from a cushion's seam.", "options": [{"text": "She may have dozed in her chair, cheek against the wing.", "quality": "sound", "feedback": "Careful and plausible. It fits a short sleep; it doesn't tell you when.", "effects": {"flags": ["pell_crease"], "xp": {"observation": 5}}}, {"text": "She has been crying into a pillow.", "quality": "dismissive", "feedback": "Possible, given what she found — but the crease is from a seam, not a soft pillow.", "effects": {}}]}, {"id": "hands", "x": 50, "y": 90, "label": "Hands", "text": "Red, work-worn hands, a burn scar across one knuckle.", "options": [{"text": "A lifetime of work. Nothing to do with tonight.", "quality": "sound", "feedback": "Right. Some details are simply a life.", "effects": {"xp": {"observation": 1}}}, {"text": "A fresh injury from a struggle.", "quality": "wrong", "feedback": "The scar is years old and smooth.", "effects": {"trust": -5}}]}]}, "thomas": {"requires": ["done:thomas_open"], "intro": "Thomas Hale slouches by the window, as though posture were a form of protest.", "details": [{"id": "counter", "x": 68, "y": 76, "label": "Waistcoat", "text": "A small bone counter — a gaming chip — has slipped into the fold of his waistcoat pocket.", "options": [{"text": "He's been gambling recently — possibly tonight.", "quality": "sound", "feedback": "A sound lead. It might explain why he won't name his 'friend'.", "effects": {"flags": ["thomas_chip"], "trust": 0, "xp": {"observation": 5}}}, {"text": "He's been to a gaming house, so he's lying about everything.", "quality": "overreach", "feedback": "Lying about one thing does not mean lying about all things.", "effects": {"trust": -8}}]}, {"id": "eyes", "x": 50, "y": 34, "label": "Eyes", "text": "Red-rimmed eyes. He has been drinking, or crying, or both.", "options": [{"text": "Drink or grief — I can't tell which from his eyes.", "quality": "sound", "feedback": "Good. Honest uncertainty beats a confident guess.", "effects": {"xp": {"psychology": 3}}}, {"text": "Guilt is eating at him.", "quality": "wrong", "feedback": "Guilt, grief and gin all look alike in the eyes.", "effects": {}}]}]}}, "propositions": [{"id": "p_latch", "text": "The locked door proves nothing about who was inside: the latch locks itself when pulled shut.", "requires": [{"any": ["ev:e_latch", "ev:t_pell_found"]}], "support": [["e_latch"], ["t_pell_found"]], "xp": {"logic": 5}, "supportNote": "A spring latch can be locked from outside simply by closing the door. The 'locked room' was never a riddle."}, {"id": "w_locked", "text": "The killer must have been inside the room when it was locked.", "requires": [{"any": ["ev:e_latch", "flag:pell_spoke"]}], "wrong": true, "suggest": [["t_pell_initial"]], "contradictedBy": [["e_latch"], ["t_pell_found"]], "contradictNote": "The door locks itself when pulled shut. Anyone could have left and locked it behind them."}, {"id": "p_not_fall", "text": "Dr. Hale's wound was not made by the fender.", "requires": ["ev:e_fender"], "support": [["e_wound_match"], ["e_wound", "e_fender", "t_surgeon"]], "suggest": [["e_wound", "e_fender"], ["e_fender"]], "xp": {"forensics": 5, "logic": 3}, "supportNote": "A curved wound cannot come from a square corner — and the fender carries a smear, not an impact."}, {"id": "p_poker", "text": "The poker was used, then wiped and hung back in haste.", "requires": ["ev:e_poker"], "support": [["e_poker", "e_wound_match"], ["e_poker", "t_pell_habits", "e_wound"]], "suggest": [["e_poker"], ["e_poker", "e_wound"]], "xp": {"forensics": 5, "logic": 3}, "supportNote": "In a house where every iron hung on its own hook, the poker alone was wiped clean and hung wrongly — and the wound fits it."}, {"id": "p_watch_set", "text": "The watch's 9:42 was set by hand after the glass broke; it cannot fix the time of death.", "requires": ["ev:e_watch"], "support": [["e_watch_set"]], "xp": {"logic": 8}, "supportNote": "Glass beneath the hand, crown drawn out: the hands moved after the fall."}, {"id": "w_accident", "text": "Dr. Hale fell and struck his head on the fender at 9:42.", "requires": ["ev:e_watch"], "wrong": true, "suggest": [["e_watch", "t_crane_accident"], ["e_watch", "e_fender"]], "contradictedBy": [["e_watch_set"], ["prop:p_not_fall"], ["e_wound_match"]], "contradictNote": "The watch was set by hand, and the wound does not fit the fender. The 'accident' was arranged."}, {"id": "p_alive_905", "text": "Dr. Hale was alive, and quarrelling with an older man, at about 9:05.", "requires": ["ev:t_clara_revised"], "support": [["t_clara_revised", "e_glove"]], "suggest": [["t_clara_revised"]], "xp": {"logic": 4}, "supportNote": "Miss Wren's account is corroborated by her glove on the railings, dropped before the rain."}, {"id": "p_window", "text": "Dr. Hale died after 9:05 — so the 9:42 reading gives nobody an alibi.", "requires": ["prop:p_alive_905"], "support": [["prop:p_alive_905", "prop:p_watch_set"], ["prop:p_alive_905", "e_watch_set"]], "xp": {"logic": 6}, "supportNote": "Hale was alive at 9:05 and the watch time is false. Anyone in Harley Street between 9:05 and the body's discovery had the opportunity."}, {"id": "p_visitor_friend", "text": "Hale's last visitor was a colleague or friend, not a patient.", "requires": ["ev:e_two_glasses"], "support": [["e_two_glasses", "t_pell_brandy"]], "suggest": [["e_two_glasses"]], "xp": {"psychology": 3, "logic": 3}, "supportNote": "Hale poured brandy only for colleagues and old friends."}, {"id": "p_pell_slept", "text": "Mrs. Pell slept through the evening; her 'nobody called' tells us nothing.", "requires": ["flag:pell_spoke"], "support": [["t_pell_revised"], ["e_bell_indicator", "e_gin"], ["e_bell_indicator", "e_mending"]], "suggest": [["e_gin"], ["e_mending"], ["e_bell_indicator"], ["c_pell_visitors"]], "xp": {"psychology": 3}, "supportNote": "Someone rang and nobody answered; she was not mending. Her account of the evening is absence, not observation."}, {"id": "p_motive", "text": "Hale meant to report Dr. Crane to the Commissioners in Lunacy over a false certificate.", "requires": [{"any": ["ev:e_letter_fragment", "flag:knows_crane_quarrel", "flag:hale_duty"]}], "support": [["e_letter_fragment"], ["t_pell_crane_thursday", "t_crane_slip"]], "suggest": [["t_pell_crane_thursday", "t_thomas_duty"], ["t_pell_crane_thursday", "e_diary"], ["t_thomas_duty"]], "xp": {"logic": 6, "psychology": 3}, "supportNote": "Hale's own words survive on the blotter — or in Crane's 'one signature' and Thursday's 'you put your name to it'."}, {"id": "p_crane_thursday_lie", "text": "Dr. Crane lied about when he last saw Hale.", "requires": ["ev:t_crane_lastseen"], "support": [["t_crane_lastseen", "t_pell_crane_thursday"], ["t_crane_lastseen", "e_diary"], ["c_crane_thursday"]], "xp": {"logic": 4}, "supportNote": "He was here on Thursday, two days ago, and quarrelled with Hale."}, {"id": "p_crane_harley", "text": "Dr. Crane was at the corner of Harley Street at about 9:22.", "requires": [{"any": ["ev:e_cab_ticket", "ev:e_beat_log"]}], "support": [["t_cabman"]], "suggest": [["e_beat_log", "t_porter"], ["e_cab_ticket", "e_beat_log"]], "xp": {"logic": 6}, "supportNote": "The cabman collected a man of Crane's description at the corner and set him down at Crane's club."}, {"id": "p_crane_route_lie", "text": "Dr. Crane lied about his route to the club.", "requires": ["ev:t_crane_alibi"], "support": [["t_crane_alibi", "t_cabman"], ["t_crane_cab_lie", "t_cabman"], ["c_crane_route"]], "xp": {"logic": 5}, "supportNote": "He said Wimpole Street; the cab found him in Harley Street, a few doors from No. 41."}, {"id": "p_crane_opportunity", "text": "Dr. Crane had the opportunity: he was steps from No. 41 inside the window of death.", "requires": ["prop:p_crane_harley"], "support": [["prop:p_crane_harley", "prop:p_window"]], "xp": {"logic": 8}, "supportNote": "Hale died after 9:05; Crane was at the corner at 9:22 and lied about it."}, {"id": "p_scratch", "text": "Dr. Crane's scratched wrist fits the skin under Hale's nails.", "requires": ["ev:o_crane_scratch"], "suggest": [["o_crane_scratch", "t_surgeon"], ["o_crane_scratch", "t_cabman"]], "xp": {"psychology": 2}, "suggestNote": "Consistent — but in 1894 nobody can match skin to a man. This can only ever support, never prove."}, {"id": "p_thomas_clear", "text": "Thomas Hale was in Greek Street from before nine onward.", "requires": ["ev:t_thomas_revised"], "support": [["t_sallis"]], "suggest": [["t_thomas_revised"]], "xp": {"logic": 3}, "supportNote": "Independent witnesses with no reason to protect him confirm it."}, {"id": "w_thomas", "text": "Thomas came back after 8:30 and killed his uncle.", "requires": ["ev:e_thomas_note"], "wrong": true, "suggest": [["e_thomas_note", "t_thomas_initial"], ["e_thomas_note"]], "contradictedBy": [["t_sallis"], ["prop:p_thomas_clear"]], "contradictNote": "Four witnesses with no love for him put Thomas at the card tables from before nine."}, {"id": "w_clara", "text": "Miss Wren kept her appointment and attacked Dr. Hale.", "requires": ["ev:e_glove"], "wrong": true, "suggest": [["e_glove", "e_diary"], ["e_glove", "t_clara_initial"]], "contradictedBy": [["prop:p_visitor_friend", "t_clara_revised"], ["e_two_glasses", "t_pell_brandy", "t_clara_revised"]], "contradictNote": "Hale shared brandy with his visitor — a courtesy he never gave patients — and a man was heard with him. Miss Wren lied, but about being there, not about this."}, {"id": "w_intruder", "text": "A burglar entered by the window and was surprised by Dr. Hale.", "requires": ["flag:examined_body"], "wrong": true, "suggest": [], "contradictedBy": [["e_two_glasses"], ["e_latch", "e_two_glasses"]], "contradictNote": "Burglars aren't poured brandy. And the window was latched with unbroken dust."}], "timeline": {"start": "20:00", "end": "22:30", "lanes": ["hale", "crane", "clara", "thomas", "pell", "other"], "laneNames": {"hale": "Dr. Hale", "crane": "Dr. Crane", "clara": "Miss Wren", "thomas": "Thomas Hale", "pell": "Mrs. Pell", "other": "Street & police"}, "events": [{"id": "tl_body", "lane": "hale", "start": "22:05", "label": "Body found by Mrs. Pell", "kind": "verified", "source": "Mrs. Pell; police arrived 10:15"}, {"id": "tl_surgeon", "lane": "hale", "start": "21:00", "end": "22:00", "label": "Death, by body warmth", "kind": "estimated", "source": "Police surgeon — a range, not a time"}, {"id": "tl_watch", "lane": "hale", "start": "21:42", "label": "Watch hands read 9:42", "kind": "documentary", "source": "The watch itself (unverified)"}, {"id": "tl_argument", "lane": "hale", "start": "21:03", "end": "21:07", "label": "Heard quarrelling with an older man", "kind": "claimed", "source": "Miss Wren (revised account)"}, {"id": "tl_thomas_visit", "lane": "thomas", "start": "20:15", "end": "20:30", "label": "Visits uncle; refused money", "kind": "corroborated", "source": "Mrs. Pell and Thomas agree"}, {"id": "tl_thomas_friend", "lane": "thomas", "start": "20:40", "end": "22:30", "label": "'At a friend's rooms, Jermyn St'", "kind": "claimed", "source": "Thomas (first account)"}, {"id": "tl_thomas_gaming_claim", "lane": "thomas", "start": "20:50", "end": "22:30", "label": "At Sallis's, Greek Street", "kind": "claimed", "source": "Thomas (revised account)"}, {"id": "tl_thomas_gaming", "lane": "thomas", "start": "20:50", "end": "22:30", "label": "Sallis's confirmed", "kind": "verified", "source": "Sallis and three players"}, {"id": "tl_pell_no_visitors", "lane": "pell", "start": "20:30", "end": "22:05", "label": "'Nobody called'", "kind": "claimed", "source": "Mrs. Pell (first account)"}, {"id": "tl_pell_asleep", "lane": "pell", "start": "20:45", "end": "22:00", "label": "Asleep by the range", "kind": "claimed", "source": "Mrs. Pell (revised; kitchen clock 4 min slow)"}, {"id": "tl_clara_home", "lane": "clara", "start": "20:00", "end": "22:00", "label": "'At home in Kensington'", "kind": "claimed", "source": "Miss Wren (first account) — unconfirmed"}, {"id": "tl_clara_door", "lane": "clara", "start": "21:00", "end": "21:08", "label": "On the step; flees without ringing", "kind": "claimed", "source": "Miss Wren (revised); glove supports"}, {"id": "tl_crane_dine", "lane": "crane", "start": "20:00", "end": "21:00", "label": "'Dining alone, Wimpole St'", "kind": "claimed", "source": "Dr. Crane"}, {"id": "tl_crane_walk", "lane": "crane", "start": "21:00", "end": "21:30", "label": "'Walking to the club'", "kind": "claimed", "source": "Dr. Crane (first account)"}, {"id": "tl_crane_cabclaim", "lane": "crane", "start": "21:20", "end": "21:30", "label": "'Cab from Wimpole St'", "kind": "claimed", "source": "Dr. Crane (second account)"}, {"id": "tl_cab_pickup", "lane": "crane", "start": "21:20", "end": "21:25", "label": "Cab 4127 collects him, Harley/Weymouth St", "kind": "verified", "source": "Cabman Bigg — 'twenty past, twenty-five past, not half past'"}, {"id": "tl_crane_club", "lane": "crane", "start": "21:30", "end": "22:15", "label": "At the Cavendish Club", "kind": "verified", "source": "Club porter and visitors' book"}, {"id": "tl_rain", "lane": "other", "start": "21:20", "label": "Rain begins", "kind": "verified", "source": "PC Doyle's beat log"}, {"id": "tl_gent_cab", "lane": "other", "start": "21:22", "label": "Tall gentleman hails cab, Weymouth St", "kind": "verified", "source": "PC Doyle — face not seen"}, {"id": "tl_crane_thursday", "lane": "crane", "day": "Thursday 4 p.m.", "label": "Calls on Hale; quarrel", "kind": "corroborated", "source": "Diary 'L.C.' and Mrs. Pell"}, {"id": "tl_crane_lastseen", "lane": "crane", "day": "'A week or more ago'", "label": "'Last saw Hale a week ago'", "kind": "claimed", "source": "Dr. Crane"}], "conflicts": [{"a": "tl_crane_walk", "b": "tl_cab_pickup", "note": "Crane says he walked from Wimpole Street. Cab 4127 picked him up at the corner of Harley Street, a few doors from No. 41, at about 9:22.", "effects": {"evidence": ["c_crane_route"], "xp": {"logic": 8}, "achieve": ["alibi_breaker"]}}, {"a": "tl_crane_cabclaim", "b": "tl_cab_pickup", "note": "Crane's second story — a cab from Wimpole Street — is contradicted by the cabman: the fare began at Harley and Weymouth Streets.", "effects": {"evidence": ["c_crane_route"], "xp": {"logic": 6}, "achieve": ["alibi_breaker"]}}, {"a": "tl_crane_lastseen", "b": "tl_crane_thursday", "note": "Crane says a week; he was in Hale's consulting room on Thursday, two days ago.", "effects": {"evidence": ["c_crane_thursday"], "xp": {"logic": 5}}}, {"a": "tl_pell_no_visitors", "b": "tl_argument", "note": "Mrs. Pell says no one came after 8:30. Miss Wren heard a man with Hale at 9:05. One of them is mistaken or lying — and Mrs. Pell's kitchen is two floors below.", "effects": {"evidence": ["c_pell_visitors"], "xp": {"logic": 5}}}, {"a": "tl_thomas_friend", "b": "tl_thomas_gaming", "note": "Thomas's first account was false — but the truth clears him rather than condemning him.", "effects": {"xp": {"logic": 3, "psychology": 2}}}], "nonConflicts": [{"a": "tl_watch", "b": "tl_crane_club", "note": "No conflict: if Hale died at 9:42, Crane at his club is cleared. That is exactly why the watch time matters so much — and why you should ask who it helps."}, {"a": "tl_watch", "b": "tl_surgeon", "note": "No conflict: 9:42 sits inside the surgeon's range. The surgeon can't confirm the watch — only fail to rule it out."}, {"a": "tl_rain", "b": "tl_crane_club", "note": "No conflict: a damp coat at 9:30 fits anyone out of doors after 9:20, walking or riding."}, {"a": "tl_clara_home", "b": "tl_clara_door", "note": "These are two accounts from the same witness. The second replaces the first — but ask why she lied before you decide what the lie means."}]}, "hints": [{"unless": ["flag:examined_body"], "text": "Start with the man himself. The consulting room is through that door. Look at everything — and then look again."}, {"unless": ["ev:e_latch"], "text": "Everyone keeps saying 'locked room'. Have you looked at the lock?"}, {"unless": ["ev:e_watch"], "text": "His watch is on the rug. Everyone's very fond of that watch."}, {"requires": ["ev:e_watch"], "unless": ["ev:e_watch_set"], "text": "That watch would bear a proper look under a glass. The Lab, if you like."}, {"unless": ["done:pell_open"], "text": "Mrs. Pell found him. She's in her kitchen."}, {"unless": ["done:crane_open"], "text": "Dr. Crane is in the drawing room with the others, holding court about accidents."}, {"requires": ["flag:pell_vague"], "unless": ["flag:pell_admitted"], "text": "Mrs. Pell's evening has a hole in it. Hard questions or a kind word — you know her better than I do by now. Her kitchen might answer for her."}, {"requires": ["done:clara_open"], "unless": ["flag:clara_admitted"], "text": "Miss Wren is frightened of something. It may not be us. Something of hers may be closer to this house than she says."}, {"unless": ["ev:e_beat_log"], "text": "PC Doyle walked this beat all evening. Ask me for his book."}, {"requires": ["done:crane_open"], "unless": ["ev:t_crane_alibi"], "text": "Crane's very sure of the time. Ask him about his own evening."}, {"requires": ["ev:e_blotter"], "unless": ["ev:e_letter_fragment"], "text": "Blotting paper keeps secrets backwards. A mirror helps."}, {"requires": ["done:crane_open"], "unless": ["ev:e_cab_ticket", "flag:unlocked_carriage"], "text": "Have you had a proper look at Dr. Crane? Not at what he says. At him."}, {"requires": ["flag:unlocked_carriage"], "unless": ["ev:t_cabman"], "text": "The cabman's waiting at the Carriage Office."}, {"requires": ["ev:t_cabman"], "unless": ["ev:c_crane_route"], "text": "Put the cabman's time beside Crane's own story on the timeline, and compare them."}, {"text": "You may have enough. Test your theories on the board — and when you're ready, I'll hear your accusation. There's no shame in waiting until you're sure."}], "accusation": {"suspects": [{"id": "crane", "label": "Dr. Lionel Crane"}, {"id": "thomas", "label": "Thomas Hale"}, {"id": "clara", "label": "Miss Clara Wren"}, {"id": "pell", "label": "Mrs. Agnes Pell"}, {"id": "none", "label": "No one — it was an accident"}], "questions": {"what": {"label": "What happened?", "options": [{"id": "a_accident", "label": "Dr. Hale fell and struck his head on the fender."}, {"id": "a_staged", "label": "Dr. Hale was struck down and the scene arranged to look like an accidental fall."}, {"id": "a_intruder", "label": "A burglar surprised Dr. Hale and fled."}, {"id": "a_patient", "label": "A distressed patient attacked Dr. Hale during a session."}]}, "motive": {"label": "Why?", "options": [{"id": "m_none", "label": "No motive — it was an accident."}, {"id": "m_money", "label": "To inherit, or out of rage at a refused loan."}, {"id": "m_silence", "label": "To stop Dr. Hale reporting a false lunacy certificate."}, {"id": "m_shame", "label": "To keep a private treatment secret."}, {"id": "m_theft", "label": "Robbery."}]}, "method": {"label": "How?", "options": [{"id": "me_fall", "label": "A fall against the fender."}, {"id": "me_pushed", "label": "Pushed against the fender in a quarrel."}, {"id": "me_poker", "label": "Struck with the poker, which was wiped and replaced; the watch was reset to 9:42."}, {"id": "me_poison", "label": "Poison in the brandy."}]}, "time": {"label": "When?", "options": [{"id": "tw_830", "label": "Between 8:15 and 8:30"}, {"id": "tw_905", "label": "Between about 9:05 and 9:22"}, {"id": "tw_942", "label": "At 9:42"}, {"id": "tw_1000", "label": "Shortly before 10:05"}]}}, "solution": {"culprit": "crane", "what": "a_staged", "motive": "m_silence", "method": "me_poker", "time": "tw_905"}, "pillars": [{"id": "timing", "label": "The watch time is false", "any": ["e_watch_set", "t_clara_revised"]}, {"id": "method", "label": "How he was killed", "any": ["e_wound_match", "e_poker", "t_surgeon"]}, {"id": "motive", "label": "Why Crane needed him silent", "any": ["e_letter_fragment", "t_crane_slip", "t_pell_crane_thursday"]}, {"id": "presence", "label": "Crane at Harley Street", "any": ["t_cabman", "c_crane_route"]}, {"id": "deceit", "label": "Crane's lies", "any": ["c_crane_route", "c_crane_thursday", "t_crane_cab_lie"]}], "misleading": ["e_thomas_note", "e_clara_file", "t_crane_accident", "e_glove", "e_gin"], "alternatives": [{"id": "alt_accident", "label": "That it was an accident at 9:42", "refutedBy": [["e_watch_set"], ["e_wound_match"], ["e_poker", "e_wound"]]}, {"id": "alt_thomas", "label": "That Thomas Hale returned and killed him", "refutedBy": [["t_sallis"]]}, {"id": "alt_clara", "label": "That Miss Wren attacked him", "refutedBy": [["e_two_glasses", "t_pell_brandy"], ["t_clara_revised", "e_two_glasses"]]}, {"id": "alt_pell", "label": "That Mrs. Pell is responsible", "refutedBy": [["t_pell_revised", "e_bell_indicator"], ["e_bell_indicator", "e_gin"]]}, {"id": "alt_intruder", "label": "That an intruder did it", "refutedBy": [["e_two_glasses"]]}], "minEvidenceWarning": 3}, "endings": [{"id": "end_justice", "when": {"culprit": "crane", "minReasoning": 70}, "title": "The Answer Was in Front of Us", "text": ["At Bow Street, Graves lays it out in the order you gave it to him: the watch with glass beneath its hand; the poker, wiped and hung on the wrong hook in a house where nothing was ever on the wrong hook; Hale's letter, read backwards from his own blotter; a cabman who will swear to a corner of Harley Street.", "Crane listens without interrupting. When Graves reaches the cabman, he takes off his spectacles and does not put them back on. 'He would not wait,' he says at last. 'One week. I asked him for one week.'", "He is committed for trial. In January the Commissioners in Lunacy order Mrs. Margaret Ellery's release; she walks out of the asylum gate on her sister's arm.", "Miss Wren's name does not appear in a single newspaper. Mrs. Pell finds a place in Hampstead with a reference from Inspector Graves. Thomas Hale inherits, and, to the surprise of everyone including himself, pays his debts."]}, {"id": "end_thin", "when": {"culprit": "crane", "maxReasoning": 69}, "title": "The Right Man, Not Enough Case", "text": ["You were right. You were not ready.", "Crane's solicitor dismantles the case in an afternoon: a stopped watch, a hunch, a man with a scratched wrist in a city full of cats. The magistrate discharges him for want of evidence.", "Crane resigns from the Cavendish Club and sails for the Cape in March. Mrs. Ellery remains where her certificate put her.", "Graves says nothing reproachful. He doesn't need to. 'Right man,' he says on the steps. 'Next time, bring me the case as well as the name.'"]}, {"id": "end_accident", "when": {"culprit": "none"}, "title": "Death by Misadventure", "text": ["The coroner's jury takes eleven minutes: the deceased, an overworked man, rose too quickly, fell, and struck his head upon the fender at or about 9:42 p.m. Death by misadventure.", "Dr. Lionel Crane gives a moving eulogy at Kensal Green.", "The letter to the Commissioners in Lunacy is never posted, because it no longer exists. Mrs. Margaret Ellery remains confined. She dies there in 1901.", "Somewhere in your notes, a watch still reads 9:42. You never asked who that time was for."]}, {"id": "end_thomas", "when": {"culprit": "thomas"}, "title": "The Convenient Heir", "text": ["Thomas Hale is arrested the next morning. The newspapers enjoy him enormously: the dissolute nephew, the threatening note, the fortune.", "It takes Sallis's card room three days to come forward — they have their own reasons to fear the police — and when they do, four men swear Thomas was losing at their tables from before nine. He is released, his name ruined and his inheritance tied up in litigation.", "Meanwhile the real killer has had a week to burn whatever needed burning. Graves does not reopen the case."]}, {"id": "end_clara", "when": {"culprit": "clara"}, "title": "The Patient Who Lied", "text": ["Miss Wren is taken into custody. By evening every newspaper in London knows she was 'under the care of a mad-doctor'.", "Her uncle applies to have her declared incapable of managing her affairs; with her own lie and her own diagnosis in the papers, the application succeeds. She lied, it is true — but about being frightened on a doorstep, not about murder.", "The charge is dropped in December for want of evidence. Nothing else is restored to her. The man she heard through the door is never named."]}, {"id": "end_pell", "when": {"culprit": "pell"}, "title": "Below Stairs", "text": ["Mrs. Pell is charged. The gin behind the bread crock makes a fine headline.", "But there is no motive anybody can name, she had served the house nineteen years, and the magistrate is not a fool. She is discharged at the first hearing — without a character, and at fifty-eight, without a future place.", "The case is marked as unresolved. In a drawer at Scotland Yard, a cab number goes unchecked."]}]}, "data/handbook.json": {"articles": [{"id": "hb_abduction", "title": "Deduction, Induction and Abduction", "shelf": "Reasoning", "status": "established", "body": ["Deduction moves from premises to a conclusion that must be true if the premises are: if the door latch locks itself, and the door was pulled shut, then it is locked. Its certainty is only as good as its premises.", "Induction generalises from cases: every housekeeper you have known resets the bell-flag, so this one probably does. It yields probability, not certainty.", "Abduction — the detective's true method, despite the fiction calling it 'deduction' — is inference to the best explanation. Of all the stories that could produce these traces, which explains the most with the fewest strains? The philosopher C. S. Peirce named it in the 1860s–1900s.", "In practice: generate several explanations, ask what each predicts you should find, then go and look. A good explanation tells you where to search next."]}, {"id": "hb_observation", "title": "Seeing and Observing", "shelf": "Method", "status": "interpretation", "body": ["Holmes's line to Watson — you see, but you do not observe — is fiction, but the distinction is real. Attention is selective; we notice what we expect and what we are looking for.", "Useful habits: look at a scene twice, once broadly and once closely; ask what is missing as well as what is present; ask what an ordinary room of this kind would look like, and note the departures.", "And then the harder discipline: every detail has several explanations. Write down at least two before you choose one."]}, {"id": "hb_locked_room", "title": "The Locked Room", "shelf": "Reasoning", "status": "interpretation", "body": ["Most 'impossible' crimes   guarded: { brow: -2, tilt: -3, mouth: 0, eyes: 0.8, look: -2 },
  tense: { brow: -4, tilt: 4, mouth: -0.5, eyes: 1.05, look: 0 },
  distressed: { brow: 5, tilt: 8, mouth: -1.5, eyes: 0.9, look: 1.5 },
  angry: { brow: -7, tilt: -9, mouth: -1, eyes: 0.85, look: 0 },
  relieved: { brow: 3, tilt: 2, mouth: 2, eyes: 0.9, look: 0 }
};
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v * k))); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join(''); }
function portrait(p, mood = 'neutral', opts = {}) {
  const m = MOODS[mood] || MOODS.neutral, f = p.female, skin = p.skin, sk2 = shade(skin, 0.82), hair = p.hair, coat = p.coat;
  const gid = id('pg');
  const hairBack = {
    bun: `<ellipse cx="100" cy="62" rx="44" ry="36" fill="${hair}"/><circle cx="100" cy="36" r="17" fill="${shade(hair, 0.9)}"/>`,
    updo: `<path d="M54 92 q-6 -64 46 -66 q52 2 46 66 q-4 -36 -46 -40 q-42 4 -46 40z" fill="${hair}"/><ellipse cx="100" cy="38" rx="30" ry="16" fill="${shade(hair, 0.85)}"/>`,
    short: '', tousled: '', receding: ''
  }[p.hairStyle] || '';
  const hairFront = {
    bun: `<path d="M58 88 q2 -44 42 -46 q40 2 42 46 q-10 -30 -42 -30 q-32 0 -42 30z" fill="${hair}"/>`,
    updo: `<path d="M58 90 q4 -48 42 -50 q38 2 42 50 q-14 -30 -30 -28 q-14 -12 -24 0 q-18 -4 -30 28z" fill="${hair}"/><path d="M60 96 q-4 20 4 34" stroke="${hair}" stroke-width="5" fill="none"/>`,
    short: `<path d="M58 84 q4 -42 42 -42 q38 0 42 42 q-6 -16 -16 -20 q-26 -6 -52 0 q-12 6 -16 20z" fill="${hair}"/>`,
    tousled: `<path d="M56 88 q-2 -50 44 -50 q48 0 44 50 q-6 -20 -14 -22 l-4 10 l-8 -16 l-8 12 l-8 -14 l-8 14 l-8 -10 l-6 12 q-14 2 -24 14z" fill="${hair}"/>`,
    receding: `<path d="M58 92 q0 -30 10 -40 q4 18 2 34z M142 92 q0 -30 -10 -40 q-4 18 -2 34z" fill="${hair}"/><path d="M72 48 q28 -12 56 0" stroke="${hair}" stroke-width="3" fill="none" opacity=".5"/>`
  }[p.hairStyle] || '';
  const ey = 98 + (m.tilt > 0 ? 0 : 0), eh = 4.2 * m.eyes, lk = m.look;
  const browL = `<path d="M72 ${88 - m.brow * 0.2} q10 ${-4 - m.brow * 0.3} 20 ${m.brow > 0 ? -m.brow * 0.7 : -m.brow * 0.5}" stroke="${shade(hair, 0.8)}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  const browR = `<path d="M128 ${88 - m.brow * 0.2} q-10 ${-4 - m.brow * 0.3} -20 ${m.brow > 0 ? -m.brow * 0.7 : -m.brow * 0.5}" stroke="${shade(hair, 0.8)}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  const mouthY = 134, mc = m.mouth * 3;
  const mouth = `<path d="M88 ${mouthY} q12 ${mc} 24 0" stroke="${shade(skin, 0.55)}" stroke-width="2.6" fill="none" stroke-linecap="round"/>${f ? `<path d="M90 ${mouthY} q10 ${mc + 3} 20 0" stroke="#a65a58" stroke-width="2" fill="none" opacity=".55"/>` : ''}`;
  const facial = {
    moustache: `<path d="M84 128 q16 -10 32 0 q-4 6 -16 4 q-12 2 -16 -4z" fill="${shade(hair, 0.85)}"/>`,
    whiskers: `<path d="M60 100 q-2 40 22 52 q-6 -24 -2 -40z M140 100 q2 40 -22 52 q6 -24 2 -40z" fill="${hair}"/><path d="M86 128 q14 -6 28 0 q-6 5 -14 3 q-8 2 -14 -3z" fill="${hair}"/>`,
    beard: `<path d="M64 112 q0 50 36 54 q36 -4 36 -54 q-8 26 -36 26 q-28 0 -36 -26z" fill="${shade(hair, 0.9)}"/><path d="M84 128 q16 -8 32 0" stroke="${hair}" stroke-width="5" fill="none"/>`,
    none: ''
  }[p.facial || 'none'];
  const acc = {
    bowler: `<ellipse cx="100" cy="58" rx="56" ry="9" fill="#14161a"/><path d="M66 58 q0 -40 34 -40 q34 0 34 40z" fill="#1c1e22"/><rect x="66" y="50" width="68" height="6" fill="#2c2f34"/>`,
    cap: p.female ? `<path d="M62 62 q38 -30 76 0 q-6 10 -38 10 q-32 0 -38 -10z" fill="#f4efe4"/><path d="M62 62 q38 6 76 0" stroke="#d8d0c0" stroke-width="2" fill="none"/>` : `<path d="M60 66 q40 -40 80 0 q-40 -8 -80 0z" fill="#3a352a"/><path d="M60 66 q-14 4 -6 10 q30 -6 46 -6" fill="#2e2a20"/>`,
    hat: `<ellipse cx="96" cy="44" rx="52" ry="12" fill="#3d4652" transform="rotate(-8 96 44)"/><path d="M70 42 q0 -26 28 -26 q28 0 26 22z" fill="#4a5560" transform="rotate(-8 96 44)"/><path d="M120 30 q16 -14 24 6" stroke="#8a2a3a" stroke-width="4" fill="none"/>`,
    spectacles: `<g stroke="#c9a45c" stroke-width="1.8" fill="#dfe8ef" fill-opacity=".14"><circle cx="82" cy="${ey}" r="10"/><circle cx="118" cy="${ey}" r="10"/><path d="M92 ${ey} q8 -4 16 0"/></g>`,
    cravat: '', none: ''
  }[p.accessory || 'none'];
  const collar = f
    ? `<path d="M80 170 q20 18 40 0 l0 12 q-20 14 -40 0z" fill="${p.collar}"/>`
    : `<path d="M78 168 l22 22 l22 -22 l-4 26 l-18 8 l-18 -8z" fill="${p.collar}"/>${p.accessory === 'cravat' ? `<path d="M90 186 q10 8 20 0 l-4 22 l-6 -6 l-6 6z" fill="#7a2a2a"/>` : `<path d="M94 188 l6 6 l6 -6 l-2 22 l-8 0z" fill="#1a1a1a"/>`}`;
  const age = p.age > 45 ? `<path d="M78 112 q4 4 10 4 M122 112 q-4 4 -10 4" stroke="${sk2}" stroke-width="1.4" fill="none"/>${p.age > 54 ? `<path d="M84 76 q16 -4 32 0" stroke="${sk2}" stroke-width="1.2" fill="none"/>` : ''}` : '';
  const flush = mood === 'angry' || mood === 'tense' ? `<ellipse cx="74" cy="118" rx="9" ry="5" fill="#c4544a" opacity=".22"/><ellipse cx="126" cy="118" rx="9" ry="5" fill="#c4544a" opacity=".22"/>` : mood === 'distressed' ? `<ellipse cx="80" cy="${ey + 8}" rx="6" ry="2.5" fill="#d07a70" opacity=".35"/><ellipse cx="120" cy="${ey + 8}" rx="6" ry="2.5" fill="#d07a70" opacity=".35"/>` : '';
  const tilt = m.tilt * 0.4;
  return `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${opts.label || 'Portrait'}">
  <defs><radialGradient id="${gid}" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="${opts.bg || '#3a3226'}"/><stop offset="1" stop-color="#0f0d0b"/></radialGradient></defs>
  <rect width="200" height="250" fill="url(#${gid})"/>
  <ellipse cx="150" cy="40" rx="70" ry="60" fill="#ffcf8a" opacity=".08"/>
  <path d="M18 250 q4 -70 58 -84 q24 10 48 0 q54 14 58 84z" fill="${coat}"/>
  <path d="M76 166 q-20 40 -14 84 M124 166 q20 40 14 84" stroke="${shade(coat, 0.7)}" stroke-width="3" fill="none"/>
  ${f ? `<path d="M40 250 q8 -48 40 -70 l40 0 q32 22 40 70" fill="${shade(coat, 1.08)}" opacity=".6"/>` : ''}
  <g transform="rotate(${tilt} 100 110)">
  ${hairBack}
  <rect x="88" y="146" width="24" height="26" fill="${sk2}"/>
  ${collar}
  <ellipse cx="58" cy="106" rx="7" ry="11" fill="${sk2}"/><ellipse cx="142" cy="106" rx="7" ry="11" fill="${sk2}"/>
  <path d="M60 96 q0 -54 40 -54 q40 0 40 54 q0 38 -16 52 q-12 10 -24 10 q-12 0 -24 -10 q-16 -14 -16 -52z" fill="${skin}"/>
  <path d="M60 96 q0 38 16 52 q12 10 24 10 q-30 -10 -34 -62z" fill="${sk2}" opacity=".5"/>
  ${age}${flush}
  <ellipse cx="82" cy="${ey}" rx="7" ry="${eh}" fill="#f6f1e6"/><ellipse cx="118" cy="${ey}" rx="7" ry="${eh}" fill="#f6f1e6"/>
  <circle cx="${82 + lk}" cy="${ey}" r="3.4" fill="#2a2018"/><circle cx="${118 + lk}" cy="${ey}" r="3.4" fill="#2a2018"/>
  <circle cx="${83 + lk}" cy="${ey - 1}" r="1" fill="#fff"/><circle cx="${119 + lk}" cy="${ey - 1}" r="1" fill="#fff"/>
  <path d="M74 ${ey - eh - 1} q8 -3 16 0 M110 ${ey - eh - 1} q8 -3 16 0" stroke="${shade(skin, 0.6)}" stroke-width="1.4" fill="none"/>
  ${browL}${browR}
  <path d="M100 102 q-4 16 -6 22 q6 4 12 0" stroke="${shade(skin, 0.68)}" stroke-width="2" fill="none"/>
  ${mouth}${facial}${hairFront}${acc}
  </g>
  ${opts.hands ? `<g><path d="M70 250 q2 -30 22 -34 l18 0 q18 4 22 34z" fill="${shade(coat, 1.1)}"/><ellipse cx="84" cy="226" rx="16" ry="10" fill="${skin}"/><ellipse cx="116" cy="226" rx="16" ry="10" fill="${sk2}"/><path d="M72 222 q12 -6 24 2 M104 222 q12 -6 24 2" stroke="${shade(skin, 0.7)}" stroke-width="1.2" fill="none"/><rect x="66" y="230" width="68" height="6" fill="${p.collar}" opacity=".85"/></g>` : ''}
  <rect width="200" height="250" fill="none" stroke="${P.gold}" stroke-width="3" opacity=".6"/>
  </svg>`;
}

/* ---------- case covers ---------- */

  const base = (inner, tint) => `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">${defs()}<rect width="300" height="400" fill="${tint}"/>${inner}<rect width="300" height="400" fill="url(#vign)"/><rect x="10" y="10" width="280" height="380" fill="none" stroke="${P.gold}" stroke-width="2" opacity=".7"/><rect x="16" y="16" width="268" height="368" fill="none" stroke="${P.gold}" stroke-width=".8" opacity=".5"/></svg>`;
  switch (key) {

    case 'cover02': return base(`<path d="M150 90 q-30 30 -20 70 q-28 30 -10 70 q20 40 30 40 q10 0 30 -40 q18 -40 -10 -70 q10 -40 -20 -70z" fill="#6b3a1a"/><path d="M150 100 l0 220" stroke="${P.parch}" stroke-width="1.2"/><path d="M140 180 l20 0 M138 240 l24 0" stroke="#2a1408" stroke-width="3"/><path d="M60 330 L250 120" stroke="#c9b48a" stroke-width="2"/><path d="M110 210 l26 20" stroke="#000" stroke-width="3"/><text x="150" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="${P.gold}" letter-spacing="3">CASE II</text>`, '#2a1518');
    case 'cover03': return base(`<rect x="40" y="180" width="220" height="150" fill="#1b1f28"/><path d="M30 186 L150 110 L270 186Z" fill="#14171e"/>${[60, 100, 180, 220].map(x => `<rect x="${x}" y="210" width="22" height="34" fill="#e8b765" opacity=".6"/>`).join('')}<rect x="136" y="270" width="28" height="60" fill="#0b0d12"/><path d="M0 330 L300 330 L300 400 L0 400Z" fill="#0f1410"/><circle cx="230" cy="80" r="18" fill="#d8dde6" opacity=".35"/><text x="150" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="${P.gold}" letter-spacing="3">CASE III</text>`, '#1a2030');
    case 'cover04': return base(`<path d="M130 120 l0 70 l-40 90 q-6 20 14 20 l92 0 q20 0 14 -20 l-40 -90 l0 -70z" fill="#a8c3d6" opacity=".35" stroke="#cfdbe4"/><path d="M98 260 q52 -20 104 0 l14 30 q-6 10 -14 10 l-104 0 q-8 0 -14 -10z" fill="#3e8a6a" opacity=".6"/><rect x="122" y="110" width="56" height="12" fill="#cfdbe4" opacity=".6"/><circle cx="150" cy="230" r="4" fill="#cfe" class="flicker"/><text x="150" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="${P.gold}" letter-spacing="3">CASE IV</text>`, '#16242a');
    default: return base(`${[70, 120, 170, 220].map((x, i) => `<g transform="translate(${x} 250)"><circle cy="-80" r="16" fill="#1a1a1f"/><path d="M-22 0 q0 -60 22 -62 q22 2 22 62z" fill="#1a1a1f"/></g>`).join('')}<g transform="translate(150 150)" opacity=".5"><circle cy="-30" r="12" fill="none" stroke="${P.gold}" stroke-dasharray="3 3"/><path d="M-16 20 q0 -40 16 -40 q16 0 16 40" fill="none" stroke="${P.gold}" stroke-dasharray="3 3"/></g><text x="150" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="${P.gold}" letter-spacing="3">CASE V</text>`, '#221a26');
  }
}

async function fetchJSON(path) { if (window.__AOD_DATA?.[path]) return JSON.parse(JSON.stringify(window.__AOD_DATA[path])); const r = await fetch(path, { cache: 'no-cache' }); if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); }
async function openCase(id, { fresh = false } = {}) {
  const entry = INDEX.cases.find(c => c.id === id);
  CASE = E.indexCase(await fetchJSON(entry.file));
  if (!fresh && save.cases[id] && !save.cases[id].result) S = save.cases[id];
  else { S = E.newCaseState(CASE); }
  // older saves: make sure every field exists
  const blank = E.newCaseState(CASE); for (const k of Object.keys(blank)) if (S[k] === undefined) S[k] = blank[k];
  save.active = id; syncGlobal(); persist();
}
function syncGlobal() {
  if (!S) return;
  for (const a of S.achieve) if (!save.profile.achievements.includes(a)) save.profile.achievements.push(a);
  for (const h of S.handbook) if (!save.profile.handbook.includes(h)) save.profile.handbook.push(h);
}

/* ---------------- feedback ---------------- */
function toast(html) {
  const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; box.appendChild(t); setTimeout(() => t.remove(), 4300);
}
function feedback(out = []) {
  const xp = {}, lines = [];
  for (const o of out) {
    if (o.type === 'evidence') { lines.push(`<b>New evidence</b> · ${esc(CASE._ix.ev[o.id].name)}`); Audio.sfx('paper'); }
    else if (o.type === 'timeline') lines.push(`<b>Timeline</b> · ${esc(CASE._ix.tl[o.id].label)}`);
    else if (o.type === 'handbook') { const a = HB.articles.find(x => x.id === o.id); if (a) lines.push(`<b>Handbook</b> · ${esc(a.title)}`); }
    else if (o.type === 'achieve') { lines.push(`<b>Milestone</b> · ${esc(ACH[o.id]?.[0] || o.id)}`); Audio.sfx('discover'); }
    else if (o.type === 'location') lines.push(`<b>New place</b> · ${esc(CASE._ix.loc[o.id]?.name || o.id)}`);
    else if (o.type === 'xp') xp[o.skill] = (xp[o.skill] || 0) + o.amount;
  }
  const parts = Object.entries(xp).filter(([, v]) => v).map(([k, v]) => `${v > 0 ? '+' : ''}${v} ${E.SKILL_NAMES[k].split(' ')[0]}`);
  if (parts.length) lines.push(`<span class="muted">${parts.join(' · ')}</span>`);
  if (lines.length) toast(lines.slice(0, 5).join('<br>') + (lines.length > 5 ? `<br><span class="muted">and ${lines.length - 5} more</span>` : ''));
  syncGlobal(); persist();
}

/* ---------------- progression ---------------- */
function skillTotals() {
  const t = {}; E.SKILLS.forEach(k => t[k] = 0);
  for (const [cid, best] of Object.entries(save.profile.best)) if (!(S && S.caseId === cid && !S.result)) for (const k of E.SKILLS) t[k] += best[k] || 0;
  if (S && !S.result) for (const k of E.SKILLS) t[k] += Math.max(save.profile.best[S.caseId]?.[k] || 0, S.xp[k] || 0);
  return t;
}
function detectiveTitle() { const total = Object.values(skillTotals()).reduce((a, b) => a + Math.max(0, b), 0); let t = TITLES[0][1]; for (const [n, name] of TITLES) if (total >= n) t = name; return { title: t, total }; }

      <p style="margin:8px 0 0;font-family:var(--display);color:var(--gold2)">${esc(ch.name)}</p><p class="demeanour" style="margin:0">${ch.ally ? 'Your ally' : E.demeanour(CASE, S, id)}</p>
      <div class="row" style="margin-top:10px">

      <div class="parchment speech" aria-live="polite">${last ? `<div class="q">${esc(last.q)}</div><div class="a">${esc(last.a)}</div>` : `<div class="a" style="color:#6a5a40;font-style:italic">${esc(ch.name)} waits for you to begin.</div>`}</div>

/* --- observation mode --- */

        ${ui.obsMsg ? `<div class="verdict ${ui.obsMsg.q === 'sound' ? 'v-supported' : ui.obsMsg.q === 'dismissive' ? 'v-plausible' : 'v-contradicted'}" style="color:#2a2620">${esc(ui.obsMsg.text)}</div>` : ''}

        <div class="chips" style="margin-top:12px">${o.details.map((d, i) => `<button class="chip go" data-act="obsdet" data-id="${d.id}" aria-pressed="${ui.obsDetail === d.id}">${i + 1}. ${esc(d.label)}${S.obs[`${ch.id}:${d.id}`]?.settled != null ? ' ✓' : ''}</button>`).join('')}</div>
