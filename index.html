/* --- deduction board --- */
function propStatus(pid) { return S.props[pid]?.status || 'open'; }
const STATUS_LABEL = { open: 'Untested', working: 'Working theory', established: 'Established', rejected: 'Rejected', custom: 'Your conjecture' };
VIEWS.board = () => {
  const props = E.availableProps(CASE, S);
  const bucket = st => props.filter(p => propStatus(p.id) === st);
  const th = ui.theory;
  const list = (title, arr) => arr.length ? `<h4 class="muted small" style="margin:12px 0 6px;letter-spacing:.06em;text-transform:uppercase">${title}</h4>${arr.map(p => `<button class="theory st-${propStatus(p.id)}" data-act="theory" data-id="${p.id}" aria-pressed="${th === p.id}">${esc(p.text)}</button>`).join('')}` : '';
  return `<h1>Deduction Board</h1>
  <p class="muted">Choose a proposition, cite the evidence you think bears on it, and test it. A connection is not a proof: the board tells you whether what you cite <i>establishes</i>, <i>fits</i> or <i>contradicts</i> the claim.</p>
  <div class="board-layout">
    <div class="theories">
      ${list('Working theories', bucket('working'))}${list('Untested propositions', bucket('open'))}${list('Established', bucket('established'))}${list('Rejected', bucket('rejected'))}
      <h4 class="muted small" style="margin:12px 0 6px;letter-spacing:.06em;text-transform:uppercase">Your own hypotheses</h4>
      ${S.custom.map(c => `<button class="theory st-custom" data-act="theory" data-id="${c.id}" aria-pressed="${th === c.id}">${esc(c.text)}</button>`).join('')}
      <form data-form="custom" class="row" style="margin-top:6px"><input type="text" name="t" placeholder="Write a hypothesis of your own…" maxlength="200" style="flex:1"><button class="btn" type="submit">Add</button></form>
    </div>
    <div>
      ${th ? theoryEditor(th) : ''}
      <div class="row" style="justify-content:space-between;margin:12px 0 6px"><h3 style="margin:0">The corkboard</h3>
        <div class="row"><button class="btn ghost" data-act="link-mode" aria-pressed="${!!ui.linkMode}">${ui.linkMode ? (ui.linkFrom ? 'Tap the second card…' : 'Tap the first card…') : 'String two cards together'}</button><button class="btn ghost" data-act="pin-all">Pin all evidence</button></div></div>
      <div class="cork" id="cork">${corkboard()}</div>
      <p class="muted small">Drag cards to arrange them. Red string shows what you have cited; dark thread shows your own links. ${S.links.length ? `<button class="btn ghost" data-act="links-clear" style="min-height:32px;padding:2px 10px">Clear my threads</button>` : ''}</p>
    </div></div>`;
};
function theoryEditor(id) {
  const isCustom = id.startsWith('custom_');
  const p = isCustom ? S.custom.find(c => c.id === id) : CASE._ix.prop[id];
  if (!p) return '';
  const rec = isCustom ? p : (S.props[id] || { attached: [] });
  if (!ui.citeFor || ui.citeFor !== id) { ui.citeFor = id; ui.cite = [...(rec.attached || [])]; ui.verdict = null; }
  const st = isCustom ? 'custom' : propStatus(id);
  const v = ui.verdict;
  const name = x => x.startsWith('prop:') ? '⊢ ' + CASE._ix.prop[x.slice(5)].text : CASE._ix.ev[x]?.name || x;
  return `<div class="parchment editor">
    <span class="badge" style="color:#7a5a2a">${STATUS_LABEL[st]}</span>
    <h3 style="margin-top:6px">${esc(p.text)}</h3>
    <p class="small" style="color:#6a5a40;margin-bottom:4px">Cited evidence:</p>
    <div>${ui.cite.length ? ui.cite.map(x => `<span class="cite">${esc(name(x))}<button data-act="uncite" data-id="${esc(x)}" aria-label="Remove">×</button></span>`).join('') : '<span class="small" style="color:#6a5a40">Nothing cited yet.</span>'}</div>
    <div class="row" style="margin-top:8px">
      <select data-bind="cite" style="flex:1"><option value="">+ Cite evidence or an established proposition…</option>${E.citable(CASE, S).filter(x => !ui.cite.includes(x) && x !== 'prop:' + id).map(x => `<option value="${esc(x)}">${esc(name(x))}</option>`).join('')}</select>
    </div>
    ${isCustom ? `<p class="small" style="color:#6a5a40;margin-top:10px">Free-written hypotheses can't be tested by the board — it can only test claims it understands. Use this to organise your thinking, then look for a matching proposition.</p>
      <label class="small">Your confidence <input type="range" min="1" max="5" value="${p.confidence}" data-bind="conf" data-id="${id}"></label>
      <div class="row"><button class="btn" data-act="custom-save">Save citations</button><button class="btn ghost" style="color:#3a2a1a" data-act="custom-del" data-id="${id}">Delete</button></div>`
    : `<div class="row" style="margin-top:10px"><button class="btn primary" data-act="test">Test the reasoning</button>
      ${v?.status === 'supported' && st !== 'established' ? `<button class="btn" data-act="pstatus" data-st="established">Mark as established</button>` : ''}
      ${v?.status === 'contradicted' && st !== 'rejected' ? `<button class="btn" data-act="pstatus" data-st="rejected">Reject this theory</button>` : ''}
      ${['plausible', 'partial', 'supported'].includes(v?.status) && st !== 'working' && st !== 'established' ? `<button class="btn ghost" style="color:#3a2a1a" data-act="pstatus" data-st="working">Keep as working theory</button>` : ''}
      ${st === 'established' || st === 'rejected' || st === 'working' ? `<button class="btn ghost" style="color:#3a2a1a" data-act="pstatus" data-st="open">Reopen</button>` : ''}
      </div>
      <label class="small" style="display:block;margin-top:8px;color:#6a5a40">Your confidence in this (private): <input type="range" min="0" max="5" value="${S.props[id]?.confidence ?? 0}" data-bind="pconf" data-id="${id}"></label>
      ${v ? verdictBox(v) : ''}`}
  </div>`;
}
function verdictBox(v) {
  const head = { supported: 'Established by what you cite', plausible: 'Plausible — but not established', partial: 'Relevant, but insufficient', contradicted: 'Contradicted', unsupported: 'Unsupported' }[v.status];
  const nm = x => x.startsWith('prop:') ? CASE._ix.prop[x.slice(5)].text : CASE._ix.ev[x].name;
  return `<div class="verdict v-${v.status}" style="color:#2a2620"><b>${head}.</b> ${esc(v.note)}
    ${v.set ? `<br><span class="small">Decisive: ${v.set.map(x => esc(nm(x))).join(' + ')}</span>` : ''}
    ${v.irrelevant?.length ? `<br><span class="small">Does not bear on this: ${v.irrelevant.map(x => esc(nm(x))).join(', ')}</span>` : ''}</div>`;
}
function corkboard() {
  const nodes = []; const W = 760;
  const thIds = [...Object.keys(S.props).filter(k => S.props[k].status && S.props[k].status !== 'open' || S.props[k].attached?.length), ...S.custom.filter(c => c.attached?.length).map(c => c.id)];
  if (ui.theory && !thIds.includes(ui.theory)) thIds.push(ui.theory);
  const evIds = new Set();
  thIds.forEach(t => { const r = t.startsWith('custom_') ? S.custom.find(c => c.id === t) : S.props[t]; (r?.attached || []).forEach(x => !x.startsWith('prop:') && evIds.add(x)); });
  S.links.forEach(l => { evIds.add(l.a); evIds.add(l.b); });
  (S.pinned || []).forEach(x => evIds.add(x));
  let i = 0;
  const place = (id, def) => { if (!S.pos[id]) S.pos[id] = def; return S.pos[id]; };
  thIds.forEach((t, k) => { const p = place(t, { x: 20 + (k % 3) * 250, y: 20 + Math.floor(k / 3) * 120 }); const text = t.startsWith('custom_') ? S.custom.find(c => c.id === t)?.text : CASE._ix.prop[t]?.text; const st = t.startsWith('custom_') ? 'custom' : propStatus(t); nodes.push(`<div class="node th st-${st} ${ui.theory === t ? 'sel' : ''}" data-node="${t}" style="left:${p.x}px;top:${p.y}px"><span class="nk">${STATUS_LABEL[st]}</span>${esc(text)}</div>`); });
  [...evIds].forEach(e => { const p = place(e, { x: 30 + (i % 4) * 180, y: 300 + Math.floor(i / 4) * 90 }); i++; const ev = CASE._ix.ev[e]; if (!ev) return; nodes.push(`<div class="node ${ui.linkFrom === e ? 'sel' : ''}" data-node="${e}" style="left:${p.x}px;top:${p.y}px"><span class="nk">${esc(ev.kind)}</span>${esc(ev.name)}</div>`); });
  if (!nodes.length) return `<p style="position:absolute;inset:auto 20px 20px 20px;color:#3a2a1a;font-family:var(--hand);font-size:1.2em">Cite evidence for a proposition, or pin all evidence, and it will appear here.</p>`;
  return `<svg class="strings" id="strings"></svg>${nodes.join('')}`;
}
function drawStrings() {
  const svg = $('#strings'), cork = $('#cork'); if (!svg || !cork) return;
  const center = id => { const n = cork.querySelector(`[data-node="${CSS.escape(id)}"]`); if (!n) return null; return [n.offsetLeft + n.offsetWidth / 2, n.offsetTop + 6]; };
  let out = '';
  const ths = [...Object.entries(S.props), ...S.custom.map(c => [c.id, c])];
  for (const [tid, r] of ths) for (const x of r.attached || []) { const a = center(tid), b = center(x.startsWith('prop:') ? x.slice(5) : x); if (a && b) out += `<path d="M${a[0]} ${a[1]} Q${(a[0] + b[0]) / 2} ${Math.max(a[1], b[1]) + 30} ${b[0]} ${b[1]}" stroke="#a01818" stroke-width="2" fill="none" opacity=".85"/>`; }
  for (const l of S.links) { const a = center(l.a), b = center(l.b); if (a && b) out += `<path d="M${a[0]} ${a[1]} Q${(a[0] + b[0]) / 2} ${Math.max(a[1], b[1]) + 24} ${b[0]} ${b[1]}" stroke="#1f2633" stroke-width="2" stroke-dasharray="6 4" fill="none"/>`; }
  svg.innerHTML = out;
}
after.board = () => {
  drawStrings();
  const cork = $('#cork'); if (!cork) return;
  let drag = null;
  cork.addEventListener('pointerdown', ev => {
    const n = ev.target.closest('.node'); if (!n) return;
    const id = n.dataset.node;
    if (ui.linkMode && !id.startsWith('p_') && !id.startsWith('w_') && !id.startsWith('custom_')) { linkTap(id); return; }
    if (ui.linkMode) return;
    drag = { n, id, sx: ev.clientX, sy: ev.clientY, ox: n.offsetLeft, oy: n.offsetTop, moved: false }; n.setPointerCapture(ev.pointerId);
  });
  cork.addEventListener('pointermove', ev => {
    if (!drag) return; const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    const x = Math.max(0, Math.min(cork.clientWidth - drag.n.offsetWidth, drag.ox + dx)), y = Math.max(0, Math.min(cork.clientHeight - 40, drag.oy + dy));
    drag.n.style.left = x + 'px'; drag.n.style.top = y + 'px'; S.pos[drag.id] = { x, y }; drawStrings();
  });
  const end = () => { if (!drag) return; const { id, moved } = drag; drag = null; persist(); if (!moved) { if (CASE._ix.prop[id] || id.startsWith('custom_')) { ui.theory = id; render(); } else { ui.sel = id; go('evidence'); } } };
  cork.addEventListener('pointerup', end); cork.addEventListener('pointercancel', end);
};
function linkTap(id) {
  if (!ui.linkFrom) { ui.linkFrom = id; render(); return; }
  if (ui.linkFrom !== id && !S.links.some(l => (l.a === ui.linkFrom && l.b === id) || (l.b === ui.linkFrom && l.a === id))) { S.links.push({ a: ui.linkFrom, b: id }); toast('<b>Thread added</b> · your own link — the board does not judge it.'); }
  ui.linkFrom = null; ui.linkMode = false; persist(); render();
}

/* --- timeline --- */
VIEWS.timeline = () => {
  const T = CASE.timeline, evs = E.timelineEvents(CASE, S);
  const t0 = E.toMin(T.start), t1 = E.toMin(T.end), W = 900, left = 120, laneH = 54, top = 34;
  const lanes = T.lanes.filter(l => evs.some(e => e.lane === l && !e.day));
  const x = m => left + (m - t0) / (t1 - t0) * (W - left - 14);
  const H = top + lanes.length * laneH + 20;
  let g = `<rect width="${W}" height="${H}" fill="#f0e6cf"/>`;
  for (let m = t0; m <= t1; m += 15) g += `<line x1="${x(m)}" y1="${top - 8}" x2="${x(m)}" y2="${H - 10}" stroke="#c9b892" stroke-width="${m % 60 === 0 ? 1.4 : .6}"/>${m % 30 === 0 ? `<text x="${x(m)}" y="${top - 14}" font-size="11" text-anchor="middle" fill="#5a4a30" font-family="Georgia">${E.fmtTime(m).replace(' p.m.', '')}</text>` : ''}`;
  lanes.forEach((ln, i) => { const y = top + i * laneH; g += `<rect x="0" y="${y}" width="${W}" height="${laneH}" fill="${i % 2 ? '#ebe0c6' : 'transparent'}"/><text x="10" y="${y + laneH / 2 + 4}" font-size="13" fill="#3a2a1a" font-family="Georgia">${esc(T.laneNames[ln])}</text>`; });
  const rows = {};
  evs.filter(e => !e.day).forEach(e => {
    const li = lanes.indexOf(e.lane); const k = e.lane; rows[k] = (rows[k] || 0) + 1; const sub = (rows[k] - 1) % 3;
    const y = top + li * laneH + 6 + sub * 15, s = E.toMin(e.start), en = e.end ? E.toMin(e.end) : null; const sel = ui.tlSel.includes(e.id);
    const col = { verified: '#3d5a48', corroborated: '#6a8a6a', claimed: '#8a6a3a', estimated: '#c9a45c', documentary: '#5a3a8a' }[e.kind];
    const style = e.kind === 'claimed' ? `fill="#f7efdc" stroke="${col}" stroke-dasharray="5 3" stroke-width="2"` : e.kind === 'estimated' ? `fill="url(#hatch)" stroke="${col}"` : e.kind === 'documentary' ? `fill="#efe6f5" stroke="${col}" stroke-dasharray="2 2" stroke-width="2"` : `fill="${col}"`;
    const body = en ? `<rect x="${x(s)}" y="${y}" width="${Math.max(6, x(en) - x(s))}" height="13" rx="3" ${style}/>` : `<circle cx="${x(s)}" cy="${y + 6}" r="6.5" ${style}/>`;
    g += `<g class="tl-ev ${sel ? 'sel' : ''}" data-act="tlsel" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(e.label)}, ${e.kind}">${body}<title>${esc(e.label)}</title></g>`;
  });
  const before = evs.filter(e => e.day);
  const sel = ui.tlSel.map(id => CASE._ix.tl[id]);
  return `<h1>Timeline</h1><p class="muted">Every event carries its source. A claim is not a fact; an estimate is a range. Select two entries and compare them to test whether they can both be true.</p>
  <div class="legend"><span class="lg-verified">Verified</span><span class="lg-corroborated">Corroborated</span><span class="lg-claimed">Claimed</span><span class="lg-estimated">Estimate (range)</span><span class="lg-documentary">Documentary (unverified)</span></div>
  ${evs.length ? `<div class="tl-wrap"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Evening of 17 November"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f6ecd2"/><rect width="3" height="6" fill="#c9a45c"/></pattern></defs>${g}</svg></div>` : '<p class="muted">No events yet.</p>'}
  ${before.length ? `<h3 style="margin-top:14px">Before tonight</h3><div class="chips">${before.map(e => `<button class="chip go" data-act="tlsel" data-id="${e.id}" aria-pressed="${ui.tlSel.includes(e.id)}" style="${ui.tlSel.includes(e.id) ? 'border-color:#b02a2a' : ''}">${esc(CASE.timeline.laneNames[e.lane])} · ${esc(e.day)}: ${esc(e.label)}</button>`).join('')}</div>` : ''}
  <div class="card" style="margin-top:14px">
    ${sel.length ? sel.map(e => `<p><b class="b-gold" style="font-weight:normal;font-family:var(--display)">${esc(e.label)}</b><br><span class="small">${e.day ? esc(e.day) : esc(E.fmtTime(E.toMin(e.start)) + (e.end ? ' – ' + E.fmtTime(E.toMin(e.end)) : ''))} · <span class="badge b-muted">${e.kind}</span> · Source: ${esc(e.source)}</span></p>`).join('') : '<p class="muted">Tap an event to see its source.</p>'}
    <div class="row"><button class="btn primary" data-act="tlcompare" ${sel.length === 2 ? '' : 'disabled'}>Compare these two</button>${sel.length ? '<button class="btn ghost" data-act="tlclear">Clear selection</button>' : ''}</div>
    ${ui.tlMsg ? `<div class="verdict ${ui.tlMsg.conflict ? 'v-contradicted' : 'v-unsupported'}" style="margin-top:10px">${ui.tlMsg.conflict ? '<b>Contradiction.</b> ' : '<b>No contradiction.</b> '}${esc(ui.tlMsg.note)}</div>` : ''}
  </div>
  ${Object.keys(S.conflicts).length ? `<h3 style="margin-top:14px">Contradictions you have established</h3><ul class="props">${CASE.timeline.conflicts.filter(c => S.conflicts[[c.a, c.b].sort().join('|')]).map(c => `<li>${esc(c.note)}</li>`).join('')}</ul>` : ''}`;
};

/* --- laboratory --- */
VIEWS.lab = () => {
  const labs = E.availableLabs(CASE, S);
  return `<h1>Laboratory</h1><p class="muted">Small examinations that turn objects into findings. Each finding is evidence of consistency — rarely of certainty.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${CASE.labs.map(l => { const avail = labs.includes(l); const done = S.lab[l.id]?.done; return `<button class="card" style="text-align:left" data-act="${avail ? 'lab-open' : 'noop'}" data-id="${l.id}" ${avail ? '' : 'aria-disabled="true"'}><h3>${esc(avail ? l.name : 'Unknown examination')}</h3><p class="small muted">${avail ? esc(l.brief) : 'You have nothing yet that calls for this.'}</p>${done ? '<span class="badge b-ok">Complete</span>' : avail ? '<span class="badge b-gold">Available</span>' : '<span class="badge b-muted">Locked</span>'}</button>`; }).join('')}</div>`;
};
VIEWS.labtask = () => {
  const l = CASE._ix.lab[view.id]; const st = S.lab[l.id] || {};
  let stage = '';
  if (l.type === 'find') {
    stage = `<div class="magnifier" id="mag">${Art.labWatchArt()}${l.details.map(d => `<button class="lab-dot ${st.found?.includes(d.id) ? 'found' : ''}" style="left:${d.x}%;top:${d.y}%;width:${d.r * 2.4}%;height:${d.r * 2.4}%" data-act="labfind" data-id="${d.id}" aria-label="${st.found?.includes(d.id) ? esc(d.label) : 'Examine this spot'}"></button>`).join('')}</div>
      <div><p>${esc(l.brief)}</p>${(st.found || []).map(id => { const d = l.details.find(x => x.id === id); return `<div class="card small" style="margin-bottom:6px"><b>${esc(d.label)}.</b> ${esc(d.text)}</div>`; }).join('')}</div>`;
  } else if (l.type === 'match') {
    const tried = st.tried || []; const last = tried[tried.length - 1]; const cand = l.candidates.find(c => c.id === last);
    stage = `<div><div class="parchment" style="padding:10px">${Art.woundProfile(cand ? cand.shape : 'none', !!cand)}</div><p class="small muted">Red: your tracing of the wound. Gold: the profile you laid over it.</p></div>
      <div><p>${esc(l.brief)}</p><div class="profiles">${l.candidates.map(c => `<button class="${tried.includes(c.id) ? 'tried' : ''} ${tried.includes(c.id) && c.correct ? 'right' : ''}" data-act="labmatch" data-id="${c.id}">${Art.woundProfile(c.shape, false).replace(/<path d="M30 62[^>]+>/, '')}${esc(c.label)}</button>`).join('')}</div>
      ${cand ? `<div class="verdict ${cand.correct ? 'v-supported' : 'v-unsupported'}">${esc(cand.text)}</div>` : ''}</div>`;
  } else if (l.type === 'mirror') {
    stage = `<div class="blotter ${ui.mirrored ? '' : 'rev'}">${l.lines.map(ln => `<button class="ln ${ln.fresh ? 'fresh' : 'stale'} ${ui.labSel.includes(ln.id) ? 'picked' : ''}" data-act="labline" data-id="${ln.id}" ${ui.mirrored ? '' : 'aria-label="Reversed writing"'}>${esc(ln.text)}</button>`).join('')}</div>
      <div><p>${esc(l.brief)}</p><div class="row"><button class="btn" data-act="mirror">${ui.mirrored ? 'Take the mirror away' : 'Hold up a mirror'}</button><button class="btn primary" data-act="labmirror">Read these lines</button></div>${ui.labMsg ? `<div class="verdict ${ui.labMsg.ok ? 'v-supported' : 'v-plausible'}">${esc(ui.labMsg.text)}</div>` : ''}</div>`;
  }
  return `<button class="btn ghost" data-act="go" data-to="lab">← Laboratory</button><h1 style="margin-top:10px">${esc(l.name)}</h1>
    <div class="lab-stage">${stage}</div>
    ${st.done ? `<div class="verdict v-supported" style="margin-top:14px"><b>Finding recorded.</b> ${esc(l.complete.text)}</div>` : ''}
    <details style="margin-top:14px"><summary class="muted">The principle</summary><p class="small">${esc(l.principle)}</p></details>`;
};

/* --- journal --- */
VIEWS.journal = () => {
  const st = k => Object.entries(S.props).filter(([, r]) => r.status === k).map(([id]) => CASE._ix.prop[id]?.text).filter(Boolean);
  const contras = S.evidence.map(id => CASE._ix.ev[id]).filter(e => KIND_GROUP(e.kind) === 'contra');
  const marks = S.evidence.filter(id => S.bookmarks[id]).map(id => CASE._ix.ev[id]);
  return `<div class="journal">
    <h2>Journal — ${esc(CASE.title)}</h2>
    <h3>Notes</h3><textarea data-bind="notes" placeholder="Write freely…" aria-label="Freeform notes">${esc(S.notes)}</textarea>
    <h3>Unresolved questions</h3>
    <ul>${S.questions.map((q, i) => `<li><label class="check" style="padding:0;min-height:34px"><input type="checkbox" data-act="qtoggle" data-i="${i}" ${q.done ? 'checked' : ''}><span style="${q.done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(q.text)}</span></label></li>`).join('') || '<li style="opacity:.6">None written yet.</li>'}</ul>
    <form data-form="question" class="row"><input type="text" name="q" placeholder="Add a question…" maxlength="200" style="flex:1"><button class="btn" type="submit">Add</button></form>
    <h3>Established</h3><ul>${st('established').map(t => `<li>${esc(t)}</li>`).join('') || '<li style="opacity:.6">Nothing proven yet.</li>'}</ul>
    <h3>Working theories</h3><ul>${st('working').map(t => `<li>${esc(t)}</li>`).join('') || '<li style="opacity:.6">—</li>'}${S.custom.map(c => `<li>${esc(c.text)} <span style="opacity:.6">(my conjecture, confidence ${c.confidence}/5)</span></li>`).join('')}</ul>
    <h3>Rejected</h3><ul>${st('rejected').map(t => `<li style="text-decoration:line-through">${esc(t)}</li>`).join('') || '<li style="opacity:.6">—</li>'}</ul>
    <h3>Contradictions</h3><ul>${contras.map(e => `<li>${esc(e.description)}</li>`).join('') || '<li style="opacity:.6">None established.</li>'}</ul>
    <h3>Bookmarked evidence</h3><ul>${marks.map(e => `<li>${esc(e.name)}${S.annotations[e.id] ? ` — <i>${esc(S.annotations[e.id])}</i>` : ''}</li>`).join('') || '<li style="opacity:.6">—</li>'}</ul>
    <h3>Suspects (my ratings)</h3><ul>${CASE.characters.filter(c => !c.ally && !c.witness).map(c => `<li>${esc(c.name)}: ${'●'.repeat(S.suspicion[c.id] || 0)}${'○'.repeat(5 - (S.suspicion[c.id] || 0))}${S.dossierNotes[c.id] ? ` — ${esc(S.dossierNotes[c.id].slice(0, 120))}` : ''}</li>`).join('')}</ul>
    <details><summary>Case log (${S.log.length})</summary><ul style="font-size:.8em">${S.log.slice().reverse().map(l => `<li>${esc(l.kind)}: ${esc(l.text)}</li>`).join('')}</ul></details>
  </div>`;
};

/* --- accusation --- */
VIEWS.accuse = () => {
  const A = CASE.accusation; const f = ui.accuse || (ui.accuse = { evidence: [], rejected: { evidence: [] } });
  const ready = E.accusationReadiness(CASE, S);
  const radio = (name, opts, cur) => opts.map(o => `<label class="radio"><input type="radio" name="${name}" value="${o.id}" data-bind="acc" data-k="${name}" ${cur === o.id ? 'checked' : ''}><span>${esc(o.label)}</span></label>`).join('');
  const evOpts = (key, list) => S.evidence.map(id => CASE._ix.ev[id]).map(e => `<label class="check"><input type="checkbox" data-bind="accev" data-k="${key}" value="${e.id}" ${list.includes(e.id) ? 'checked' : ''}><span>${esc(e.name)} <span class="muted small">· ${esc(e.kind)}</span></span></label>`).join('');
  return `<h1>Formal Accusation</h1>
  <div class="card" style="border-color:${ready.enough ? '#3e6a4a' : '#8a5a2a'}"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="chip" style="padding:0;border:0;background:none"><span class="face" style="width:56px;height:56px">${Art.portrait(CASE._ix.ch.graves.portrait, ready.enough ? 'neutral' : 'tense', { label: 'Inspector Graves' })}</span></span>
  <p style="margin:0"><i>${ready.enough ? '“Take your time. A magistrate will want what happened, why, how, when — and why it wasn\'t anything else.”' : '“You\'d go before a magistrate with this? You may be right — but you may also be early. There\'s no shame in looking further.”'}</i><br><span class="small muted">You can postpone at any time — nothing is submitted until you confirm.</span></p></div></div>
  <form data-form="accuse" style="margin-top:16px">
    <div class="qa"><b>Who was responsible?</b>${radio('culprit', A.suspects, f.culprit)}</div>
    ${Object.entries(A.questions).map(([k, q]) => `<div class="qa"><b>${esc(q.label)}</b>${radio(k, q.options, f[k])}</div>`).join('')}
    <div class="qa"><b>Which evidence supports your conclusion?</b><p class="small muted">Choose the items you would put before a magistrate (up to eight). Irrelevant or prejudicial items weaken a case.</p>${evOpts('main', f.evidence)}</div>
    <div class="qa"><b>Which alternative explanation do you reject — and with what?</b>${radio('alt', A.alternatives, f.rejected.alt)}
      ${f.rejected.alt ? `<p class="small muted" style="margin-top:8px">Evidence that rules it out:</p>${evOpts('alt', f.rejected.evidence)}` : ''}</div>
    <div class="row"><button class="btn primary" type="submit">Submit the accusation</button><button class="btn ghost" type="button" data-act="go" data-to="scene">Postpone and keep investigating</button></div>
  </form>`;
};
VIEWS.ending = () => {
  const r = S.result; const end = CASE.endings.find(e => e.id === r.ending); const sol = CASE.accusation.solution;
  const yes = b => b ? '<span class="tick">✓</span>' : '<span class="cross">✗</span>';
  const label = (k, id) => (k === 'culprit' ? CASE.accusation.suspects : CASE.accusation.questions[k].options).find(o => o.id === id)?.label || '—';
  return `<div class="parchment ending">
    <span class="small" style="color:#6a5a40">${esc(CASE.title)} · Outcome</span><h1 style="color:#5a1d22">${esc(end.title)}</h1>
    ${end.text.map(p => `<p class="p">${esc(p)}</p>`).join('')}
    <hr style="border:0;border-top:1px solid #b8a47a;margin:20px 0">
    <div class="row" style="align-items:flex-start;gap:24px">
      <div><div class="score">${r.grade}</div><span class="small" style="color:#6a5a40">Reasoning ${r.reasoning}/100</span></div>
      <div style="flex:1;min-width:240px">
        <h3>The verdict on your answer</h3>
        <p>${yes(r.parts.culprit)} Culprit: ${esc(label('culprit', S.accusation.culprit))}</p>
        <h3>The verdict on your reasoning</h3>
        <p class="small" style="color:#6a5a40">Judged separately: a right answer can rest on poor reasons, and a wrong one on careful ones.</p>
        ${['what', 'motive', 'method', 'time'].map(k => `<p style="margin:0 0 4px">${yes(r.parts[k])} ${esc(CASE.accusation.questions[k].label)} ${esc(label(k, S.accusation[k]))}</p>`).join('')}
        <p style="margin-top:10px"><b>Evidence pillars covered:</b></p>${r.pillars.map(p => `<p style="margin:0 0 3px">${yes(p.covered)} ${esc(p.label)}</p>`).join('')}
        <p style="margin-top:10px">${yes(r.rejectionOk)} Alternative rejected${r.altLabel ? `: ${esc(r.altLabel)}` : ''}${r.rejectionOk ? '' : ' — not with evidence that actually rules it out'}</p>
        ${r.misleading.length ? `<p class="b-bad">Prejudicial or irrelevant items cited: ${r.misleading.map(id => esc(CASE._ix.ev[id].name)).join(', ')}</p>` : ''}
      </div></div>
    <details style="margin-top:16px"><summary><b>What really happened</b></summary>${CASE.solution.narrative.map(p => `<p>${esc(p)}</p>`).join('')}
      <p class="small" style="color:#6a5a40">The full solution: ${esc(label('culprit', sol.culprit))}; ${esc(label('what', sol.what))} ${esc(label('motive', sol.motive))} ${esc(label('method', sol.method))} ${esc(label('time', sol.time))}.</p></details>
    <div class="row" style="margin-top:18px"><button class="btn primary" data-act="go" data-to="study">Return to the study</button><button class="btn ghost" style="color:#3a2a1a" data-act="replay">Investigate again from the start</button></div>
  </div>`;
};

/* --- handbook, progress, archive, settings, dev --- */
VIEWS.handbook = () => {
  const open = new Set([...save.profile.handbook, ...(S?.handbook || [])]);
  const cur = ui.hbOpen && open.has(ui.hbOpen) ? HB.articles.find(a => a.id === ui.hbOpen) : null;
  const shelves = [...new Set(HB.articles.map(a => a.shelf))];
  return `<h1>The Detective's Handbook</h1><p class="muted">Volumes are added to your shelves as your investigations call for them. Each is marked as <span class="badge b-ok">established research</span> or <span class="badge b-warn">interpretation &amp; practice</span>.</p>
  <div class="ev-layout"><div class="handbook-list">${shelves.map(sh => `<h4 class="muted small" style="margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em">${sh}</h4>${HB.articles.filter(a => a.shelf === sh).map(a => open.has(a.id) ? `<button class="theory ${ui.hbOpen === a.id ? 'st-established' : ''}" data-act="hb" data-id="${a.id}">${esc(a.title)}</button>` : `<div class="theory" style="opacity:.45">Undiscovered volume</div>`).join('')}`).join('')}</div>
  <div>${cur ? `<article class="parchment" style="padding:22px"><span class="badge ${cur.status === 'established' ? 'b-ok' : 'b-warn'}" style="${cur.status === 'established' ? 'color:#3e6a4a' : 'color:#8a5a2a'}">${cur.status === 'established' ? 'Established research' : 'Interpretation & practice'}</span><h2 style="margin-top:8px">${esc(cur.title)}</h2>${cur.body.map(p => `<p>${esc(p)}</p>`).join('')}</article>` : '<div class="card muted">Choose a volume.</div>'}</div></div>`;
};
VIEWS.progress = () => {
  const t = skillTotals(); const dt = detectiveTitle(); const max = Math.max(60, ...Object.values(t));
  return `<h1>Milestones</h1><p><span class="b-gold" style="font-family:var(--display);font-size:1.3em">${esc(dt.title)}</span> <span class="muted">· ${dt.total} experience</span></p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Skills</h3>${E.SKILLS.map(k => `<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${E.SKILL_NAMES[k]}</span><span class="muted">${t[k]}</span></div><div class="bar"><i style="width:${Math.max(0, t[k]) / max * 100}%"></i></div></div>`).join('')}
  <p class="small muted">Experience comes from careful observation, sound inference and humane judgment — not from being right by luck. Mistakes never lock you out.</p></div>
  <div class="card"><h3>Distinctions</h3>${Object.entries(ACH).map(([k, [n, d]]) => `<p style="${save.profile.achievements.includes(k) ? '' : 'opacity:.4'}"><b class="b-gold" style="font-weight:normal;font-family:var(--display)">${save.profile.achievements.includes(k) ? '◆' : '◇'} ${esc(n)}</b><br><span class="small muted">${esc(d)}</span></p>`).join('')}</div></div>`;
};
VIEWS.archive = () => {
  const res = Object.entries(save.profile.results);
  return `<h1>Newspaper Archive</h1>${res.length ? res.map(([cid, r]) => { const c = INDEX.cases.find(x => x.id === cid); return `<div class="parchment" style="padding:20px;margin-bottom:14px"><span class="small" style="color:#6a5a40">THE TIMES · ${esc(c.date)}</span><h2>${esc(r.headline)}</h2><p>${esc(r.lede)}</p><p class="small" style="color:#6a5a40">Your reasoning: ${r.grade} (${r.reasoning}/100)</p></div>`; }).join('') : '<p class="muted">No cases closed yet. Clippings of your solved cases will be kept here.</p>'}`;
};
VIEWS.settings = () => {
  const a = Audio.settings, st = save.profile.settings;
  const sl = (k, label) => `<div class="slider"><span>${label}</span><input type="range" min="0" max="1" step="0.05" value="${a[k]}" data-bind="vol" data-k="${k}" aria-label="${label} volume"><span class="muted small">${Math.round(a[k] * 100)}</span></div>`;
  return `<h1>Settings</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <div class="card"><h3>Sound</h3><label class="check"><input type="checkbox" data-bind="soundon" ${a.on ? 'checked' : ''}><span>Sound on (always off when the game opens)</span></label>
  ${sl('master', 'Master')}${sl('rain', 'Rain')}${sl('fire', 'Fire')}${sl('city', 'Street')}${sl('music', 'Music')}${sl('effects', 'Effects')}</div>
  <div class="card"><h3>Reading &amp; display</h3>
    <div class="row">${[[1, 'Normal'], [1.12, 'Large'], [1.25, 'Larger']].map(([v, l]) => `<button class="btn ${st.fs == v ? 'primary' : 'ghost'}" data-act="fs" data-v="${v}">${l}</button>`).join('')}</div>
    <label class="check"><input type="checkbox" data-bind="markers" ${st.markers ? 'checked' : ''}><span>Mark things I've already examined in each scene</span></label>
    <label class="check"><input type="checkbox" data-bind="motion" ${st.motion ? 'checked' : ''}><span>Reduce motion (no rain, flicker or flames)</span></label></div>
  <div class="card"><h3>Your save</h3><p class="small muted">Saved automatically in this browser. Export a file to keep a backup or move to another device.</p>
    <div class="row"><button class="btn" data-act="export">Export save file</button><label class="btn ghost" style="display:inline-flex;align-items:center">Import save file<input type="file" accept="application/json,.json" data-bind="import" class="sr"></label></div>
    <details style="margin-top:10px"><summary class="small">Move a save by copy and paste</summary>
      <p class="small muted">Copy your save as text, then paste it into this box on another device and choose Load.</p>
      <textarea id="savetext" rows="4" placeholder="Paste save text here…"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn" data-act="copysave">Copy my save</button><button class="btn ghost" data-act="pastesave">Load pasted save</button></div></details>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="reset" style="border-color:#7a2a2a">Erase all progress</button></div>
    ${DEV ? '<p style="margin-top:10px"><button class="btn" data-act="go" data-to="dev">Developer tools</button></p>' : '<p class="small muted" style="margin-top:10px">Developers: add <code>?dev</code> to the address for the case validator.</p>'}</div></div>`;
};
VIEWS.dev = () => {
  if (!DEV) return '<p>Developer tools are only available with ?dev in the address.</p>';
  if (!CASE) return '<p class="muted">Open a case first.</p>';
  const r = validateCase(JSON.parse(JSON.stringify(CASE)), HB);
  return `<h1>Case validator — ${esc(CASE.title)}</h1><p><span class="badge ${r.ok ? 'b-ok' : 'b-bad'}">${r.ok ? 'PASS' : 'FAIL'}</span></p>
  ${r.errors.map(e => `<p class="b-bad small">ERROR ${esc(e)}</p>`).join('')}${r.warnings.map(e => `<p class="b-warn small">warn ${esc(e)}</p>`).join('')}${r.info.map(e => `<p class="small muted">${esc(e)}</p>`).join('')}
  <div class="row"><button class="btn" data-act="dev-hint">Graves's current hint</button><button class="btn" data-act="dev-unlock">Unlock all locations</button></div>
  <h3>Live state</h3><pre class="dev">${esc(JSON.stringify({ location: S.location, evidence: S.evidence, flags: Object.keys(S.flags), chars: S.chars, props: S.props }, null, 1))}</pre>`;
};

/* ---------------- sheets (modals) ---------------- */
function sheet(html, opts = {}) {
  closeSheet();
  const d = document.createElement('div'); d.className = 'sheet-back'; d.id = 'sheet';
  d.innerHTML = `<div class="sheet parchment ${opts.center ? 'center' : ''}" role="dialog" aria-modal="true">${html}<button class="btn ghost close" data-act="close-sheet" style="color:#3a2a1a" aria-label="Close">×</button></div>`;
  d.addEventListener('click', e => { if (e.target === d) closeSheet(); });
  document.body.appendChild(d); d.querySelector('.sheet button:not(.close), .sheet')?.focus?.();
}
function closeSheet() { $('#sheet')?.remove(); }
function hotspotSheet(r) {
  const h = r.hotspot;
  const found = r.out.filter(o => o.type === 'evidence').map(o => `<div class="found">Added to evidence: <b>${esc(CASE._ix.ev[o.id].name)}</b></div>`).join('');
  let html = `<h2>${esc(h.name)}</h2><p>${esc(r.text)}</p>${found}`;
  if (r.closerDone) html += `<p style="margin-top:12px"><i>On closer inspection:</i> ${esc(h.closer.text)}</p>`;
  html += `<div class="row" style="margin-top:14px">`;
  if (r.canCloser) html += `<button class="btn primary" data-act="closer" data-id="${h.id}">Look closer</button>`;
  if (r.choice) html += `</div><p style="margin-top:12px"><b>${esc(r.choice.prompt)}</b></p><div class="row"><button class="btn" data-act="choice" data-id="${h.id}" data-yes="1">${esc(r.choice.yesLabel)}</button><button class="btn" data-act="choice" data-id="${h.id}" data-yes="0">${esc(r.choice.noLabel)}</button>`;
  else if (h.choice && S.choices[h.id]) html += `<span class="small" style="color:#6a5a40">You chose: ${S.choices[h.id] === 'yes' ? esc(h.choice.yesLabel) : esc(h.choice.noLabel)}.</span>`;
  html += `<button class="btn ghost" style="color:#3a2a1a" data-act="close-sheet">Step back</button></div>`;
  sheet(html);
}
function presentSheet(who) {
  const ch = CASE._ix.ch[who];
  sheet(`<h2>Show ${esc(ch.name)}…</h2><p class="small" style="color:#6a5a40">Choose what to put in front of them. Their reaction may tell you something — or nothing.</p>
    <div class="ev-list" style="max-height:60vh">${S.evidence.map(id => CASE._ix.ev[id]).map(e => `<button class="ev-item k-${KIND_GROUP(e.kind)}" data-act="present" data-who="${who}" data-id="${e.id}">${Art.icon(e.icon)}${esc(e.name)}</button>`).join('')}</div>`);
}

/* ---------------- actions ---------------- */
const ACT = {
  go: d => { if (['scene', 'evidence', 'people', 'board', 'timeline', 'lab', 'journal', 'accuse'].includes(d.to) && !CASE) return go('cases'); if (d.to === 'evidence') S.evNew = {}; go(d.to); },
  enter: () => go('study'),
  'enter-sound': () => { Audio.setOn(true); go('study'); },
  sound: () => { Audio.setOn(!Audio.settings.on); save.profile.audio = { ...Audio.settings }; persist(); render(); },
  'study-board': () => CASE && !S.result ? go('board') : (toast('<b>The corkboard is bare.</b> Open a case first.'), go('cases')),
  'study-map': () => { if (!CASE || S.result) { toast('<b>No active case.</b>'); return; } sheet(`<h2>${esc(CASE.meta.location)}</h2><p class="small" style="color:#6a5a40">Places in this case. Travel to any you can reach.</p>${CASE.locations.map(l => E.canEnter(CASE, S, l.id) ? `<button class="btn" style="margin:4px" data-act="move" data-id="${l.id}">${esc(l.name)}</button>` : `<button class="btn" disabled style="margin:4px">Unknown place</button>`).join('')}`); },
  'study-journal': () => CASE && !S.result ? go('journal') : (toast('<b>Your journal is empty.</b> Open a case first.'), go('cases')),
  'case-locked': () => toast('<b>In preparation.</b> This case uses the same engine but has not yet been written in full. It is not playable.'),
  'case-open': async d => { await openCase(d.id); if (S.turns || Object.keys(S.hotspots).length) go('scene'); else go('intro'); },
  begin: () => { Audio.sfx('step'); go('scene'); },
  hot: d => { const r = E.examine(CASE, S, d.id); if (!r) return; Audio.sfx('paper'); hotspotSheet(r); feedback(r.out); },
  closer: d => { const r = E.lookCloser(CASE, S, d.id); feedback(r.out); hotspotSheet({ ...E.examine(CASE, S, d.id), out: r.out }); },
  choice: d => { const r = E.choose(CASE, S, d.id, d.yes === '1'); if (!r) return; sheet(`<h2>${esc(CASE._ix.hs[d.id].name)}</h2><p>${esc(r.text)}</p><button class="btn" data-act="close-sheet">Step back</button>`); feedback(r.out); },
  'close-sheet': () => { closeSheet(); if (view.name === 'scene') render(); },
  move: d => { closeSheet(); if (E.moveTo(CASE, S, d.id)) { Audio.sfx('step'); persist(); go('scene'); } },
  'move-talk': d => { if (E.moveTo(CASE, S, d.loc)) { Audio.sfx('step'); persist(); go('talk', { id: d.id }); } },
  talk: d => { closeSheet(); ui.obsMsg = null; go('talk', { id: d.id }); },
  dossier: d => go('dossier', { id: d.id }),
  say: d => { const l = CASE._ix.line[d.id]; const r = E.talk(CASE, S, d.who, d.id); if (!r) return; ui.lastTalk = { who: d.who, q: l.prompt, a: r.response, mood: r.mood }; Audio.sfx('type'); feedback(r.out); render(); },
  'present-open': d => presentSheet(d.id),
  present: d => { closeSheet(); const r = E.present(CASE, S, d.who, d.id); if (!r) return; ui.lastTalk = { who: d.who, q: `You show: ${CASE._ix.ev[d.id].name}`, a: r.response, mood: r.mood }; feedback(r.out); render(); },
  observe: d => { ui.obsDetail = null; ui.obsMsg = null; go('observe', { id: d.id }); },
  obsdet: d => { ui.obsDetail = d.id; ui.obsMsg = null; render(); },
  interp: d => { const r = E.interpret(CASE, S, view.id, d.id, +d.i); ui.obsMsg = { q: r.quality, text: r.feedback }; feedback(r.out); render(); },
  suspicion: d => { S.suspicion[d.id] = S.suspicion[d.id] == +d.n ? 0 : +d.n; persist(); render(); },
  evfilter: d => { ui.evFilter = d.id; render(); },
  evsel: d => { ui.sel = d.id; ui.zoom = 1; ui.rot = 0; delete S.evNew[d.id]; persist(); render(); },
  bookmark: d => { S.bookmarks[d.id] = !S.bookmarks[d.id]; persist(); render(); },
  rotate: () => { ui.rot = (ui.rot + 90) % 360; render(); },
  'compare-clear': () => { ui.compare = null; render(); },
  'lab-open': d => { ui.labSel = []; ui.mirrored = false; ui.labMsg = null; go('labtask', { id: d.id }); },
  labfind: d => { const r = E.labFind(CASE, S, view.id, d.id); feedback(r.out); if (r.complete) Audio.sfx('discover'); render(); },
  labmatch: d => { const r = E.labMatch(CASE, S, view.id, d.id); feedback(r.out); render(); },
  labline: d => { if (!ui.mirrored) { ui.labMsg = { ok: false, text: 'It is all back to front. Hold up a mirror first.' }; render(); return; } const i = ui.labSel.indexOf(d.id); i >= 0 ? ui.labSel.splice(i, 1) : ui.labSel.push(d.id); render(); },
  mirror: () => { ui.mirrored = !ui.mirrored; render(); },
  labmirror: () => { const r = E.labMirror(CASE, S, view.id, ui.mirrored, ui.labSel); ui.labMsg = r; feedback(r.out || []); render(); },
  theory: d => { ui.theory = d.id; render(); },
  uncite: d => { ui.cite = ui.cite.filter(x => x !== d.id); ui.verdict = null; render(); },
  test: () => { ui.verdict = E.evaluateProp(CASE, S, ui.theory, ui.cite); const rec = S.props[ui.theory] || (S.props[ui.theory] = { status: 'open' }); rec.attached = [...ui.cite]; persist(); render(); },
  pstatus: d => { const r = E.setPropStatus(CASE, S, ui.theory, ui.cite, d.st); if (!r.ok) toast(esc(r.msg)); else feedback(r.out); ui.verdict = r.ev; persist(); render(); },
  'custom-save': () => { const c = S.custom.find(x => x.id === ui.theory); c.attached = [...ui.cite]; persist(); toast('Saved.'); render(); },
  'custom-del': d => { S.custom = S.custom.filter(c => c.id !== d.id); ui.theory = null; persist(); render(); },
  'link-mode': () => { ui.linkMode = !ui.linkMode; ui.linkFrom = null; render(); },
  'pin-all': () => { S.pinned = [...S.evidence]; persist(); render(); },
  'links-clear': () => { S.links = []; S.pinned = []; persist(); render(); },
  tlsel: d => { const i = ui.tlSel.indexOf(d.id); if (i >= 0) ui.tlSel.splice(i, 1); else { ui.tlSel.push(d.id); if (ui.tlSel.length > 2) ui.tlSel.shift(); } ui.tlMsg = null; render(); },
  tlclear: () => { ui.tlSel = []; ui.tlMsg = null; render(); },
  tlcompare: () => { const r = E.compareEvents(CASE, S, ui.tlSel[0], ui.tlSel[1]); ui.tlMsg = r; feedback(r.out || []); render(); },
  qtoggle: d => { S.questions[+d.i].done = !S.questions[+d.i].done; persist(); render(); },
  hb: d => { ui.hbOpen = d.id; render(); },
  fs: d => { save.profile.settings.fs = +d.v; persist(); render(); },
  export: () => exportSave(),
  copysave: () => { persist(true); const txt = JSON.stringify(save); const ta = $('#savetext'); navigator.clipboard?.writeText(txt).then(() => toast('<b>Save copied.</b> Paste it on your other device.'), () => { ta.value = txt; ta.select(); toast('Select-all and copy the text in the box.'); }) ?? (ta.value = txt, ta.select()); },
  pastesave: () => { const v = $('#savetext').value.trim(); if (!v) return toast('Paste save text into the box first.'); importSave(new Blob([v])); },
  reset: () => sheet(`<h2>Erase all progress?</h2><p>This removes every case, note and milestone saved in this browser. Export a save first if you might want it back.</p><div class="row"><button class="btn primary" data-act="reset-yes">Erase everything</button><button class="btn" data-act="close-sheet">Cancel</button></div>`, { center: true }),
  'reset-yes': () => { save = blankSave(); CASE = null; S = null; persist(true); closeSheet(); go('title'); },
  replay: async () => { const id = CASE.id; delete save.cases[id]; await openCase(id, { fresh: true }); ui = { ...ui, sel: null, theory: null, tlSel: [], lastTalk: null, accuse: null }; go('intro'); },
  'accuse-confirm': () => {
    closeSheet(); const f = ui.accuse; const r = E.submitAccusation(CASE, S, { culprit: f.culprit, what: f.what, motive: f.motive, method: f.method, time: f.time, evidence: f.evidence, rejected: f.rejected });
    const end = CASE.endings.find(e => e.id === r.ending);
    const best = save.profile.best[CASE.id] || {}; for (const k of E.SKILLS) best[k] = Math.max(best[k] || 0, S.xp[k] || 0); save.profile.best[CASE.id] = best;
    const prev = save.profile.results[CASE.id];
    if (!prev || r.reasoning >= prev.reasoning) save.profile.results[CASE.id] = { grade: r.grade, reasoning: r.reasoning, ending: r.ending, headline: end.title, lede: end.text[0], correct: r.correct };
    feedback(r.out); save.cases[CASE.id] = S; persist(true); go('ending');
  },
  'dev-hint': () => toast(esc(E.hint(CASE, S))),
  'dev-unlock': () => { CASE.locations.forEach(l => (l.requires || []).forEach(t => t.startsWith('flag:') && (S.flags[t.slice(5)] = true))); persist(); toast('Unlocked.'); },
  noop: () => { }
};

/* ---------------- event wiring ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.matches('input')) return;
  if (a.getAttribute('aria-disabled') === 'true' && a.dataset.act !== 'case-locked') return;
  const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset); }
});
document.addEventListener('change', e => {
  const t = e.target; const b = t.dataset.bind;
  if (t.dataset.act === 'qtoggle') return ACT.qtoggle(t.dataset);
  if (!b) return;
  if (b === 'cite' && t.value) { ui.cite.push(t.value); ui.verdict = null; render(); }
  else if (b === 'compare') { ui.compare = t.value || null; render(); }
  else if (b === 'acc') { const f = ui.accuse; if (t.dataset.k === 'alt') f.rejected = { alt: t.value, evidence: [] }; else f[t.dataset.k] = t.value; if (t.dataset.k === 'alt') render(); }
  else if (b === 'accev') { const f = ui.accuse; const list = t.dataset.k === 'alt' ? f.rejected.evidence : f.evidence; if (t.checked) { if (t.dataset.k === 'main' && list.length >= 8) { t.checked = false; toast('Eight items at most. Choose the strongest.'); return; } list.push(t.value); } else list.splice(list.indexOf(t.value), 1); }
  else if (b === 'soundon') { Audio.setOn(t.checked); save.profile.audio = { ...Audio.settings }; persist(); render(); }
  else if (b === 'markers' || b === 'motion') { save.profile.settings[b] = t.checked; persist(); render(); }
  else if (b === 'import' && t.files[0]) importSave(t.files[0]);
  else if (b === 'conf') { const c = S.custom.find(x => x.id === t.dataset.id); c.confidence = +t.value; persist(); }
  else if (b === 'pconf') { (S.props[t.dataset.id] ||= { status: 'open', attached: [] }).confidence = +t.value; persist(); }
});
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset.bind; if (!b) return;
  if (b === 'notes') { S.notes = t.value; persist(); }
  else if (b === 'annot') { S.annotations[t.dataset.id] = t.value; persist(); }
  else if (b === 'dnote') { S.dossierNotes[t.dataset.id] = t.value; persist(); }
  else if (b === 'zoom') { ui.zoom = +t.value; const s = $('#zoombox svg'); if (s) s.style.transform = `scale(${ui.zoom}) rotate(${ui.rot}deg)`; }
  else if (b === 'vol') { Audio.set(t.dataset.k, +t.value); t.nextElementSibling.textContent = Math.round(t.value * 100); save.profile.audio = { ...Audio.settings }; persist(); }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'custom') { const v = e.target.t.value.trim(); if (!v) return; ui.theory = E.addCustomTheory(S, v); persist(); render(); }
  else if (f === 'question') { const v = e.target.q.value.trim(); if (!v) return; S.questions.push({ text: v, done: false }); persist(); render(); }
  else if (f === 'accuse') {
    const a = ui.accuse; const missing = ['culprit', 'what', 'motive', 'method', 'time'].filter(k => !a[k]);
    if (missing.length) { toast('Answer every question first — what, who, why, how and when.'); return; }
    if (!a.evidence.length) { toast('A magistrate will want evidence. Choose at least one item.'); return; }
    if (!a.rejected.alt) { toast('Say which alternative explanation you reject.'); return; }
    const ready = E.accusationReadiness(CASE, S);
    sheet(`<h2>Present your case?</h2><p>${ready.enough ? 'Once submitted, this playthrough ends and the outcome is decided by what actually happened.' : '<b>Graves hesitates.</b> “I\'ll take it to the magistrate if you insist. But I don\'t think you\'ve seen everything there is to see.”'}</p><div class="row"><button class="btn primary" data-act="accuse-confirm">Submit</button><button class="btn" data-act="close-sheet">Keep investigating</button></div>`, { center: true });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); if (view.name === 'observe') go('talk', { id: view.id }); }
  if (view.name === 'talk' && /^[1-9]$/.test(e.key) && !e.target.matches('input,textarea,select')) { const b = document.querySelectorAll('.line-btn')[+e.key - 1]; b?.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tl-ev')) { e.preventDefault(); ACT.tlsel(e.target.dataset); }
});

/* ---------------- boot ---------------- */
function applySettings() { Audio.load(save.profile.audio); }
async function boot() {
  try { [INDEX, HB] = await Promise.all([fetchJSON('cases/index.json'), fetchJSON('data/handbook.json')]); }
  catch (e) { $('#app').innerHTML = `<div class="frame"><main><h1>The case files could not be opened</h1><p>${esc(e.message)}</p><p class="muted">This game must be served over http(s) — for example from GitHub Pages — rather than opened as a local file. See the README.</p></main></div>`; return; }
  applySettings();
  if (save.active && save.cases[save.active] && !save.cases[save.active].result) { try { await openCase(save.active); } catch (e) { console.warn(e); } }
  render();
  const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !framed) navigator.serviceWorker.register('sw.js').catch(() => { });
}
window.addEventListener('pagehide', () => persist(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(true); });
boot();

return {  };
})();
</script>
</body>
</html>
